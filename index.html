<title>نبضة DJ</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap">
<style>
  :root{
    --bg:#0b0c10;
    --panel:#16171d;
    --panel-2:#1d1f27;
    --panel-3:#262832;
    --line:rgba(255,255,255,.08);
    --line-2:rgba(255,255,255,.15);
    --text:#eef0f4;
    --text-dim:#8b8d99;
    --text-faint:#565964;
    --deckA:#35d7c4;
    --deckA-soft:rgba(53,215,196,.15);
    --deckB:#ef4a56;
    --deckB-soft:rgba(239,74,86,.15);
    --gold:#ffb84d;
    --danger:#ff6b6b;
    --shadow:0 30px 70px -30px rgba(0,0,0,.75);
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  body{
    background:
      radial-gradient(1000px 520px at 12% -8%, rgba(53,215,196,.08), transparent 60%),
      radial-gradient(1000px 520px at 88% -8%, rgba(239,74,86,.08), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Cairo',system-ui,sans-serif;
    direction:rtl;
    min-height:100%;
  }
  .app{
    max-width:1240px;
    margin:0 auto;
    min-height:100vh;
    min-height:100dvh;
    padding:18px 14px calc(76px + env(safe-area-inset-bottom,0px));
    display:flex;
    flex-direction:column;
    gap:16px;
  }

  /* ---------- header ---------- */
  .topbar{
    flex:none;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:11px;}
  .brand-mark{
    width:36px;height:36px;border-radius:10px;
    background:linear-gradient(155deg,var(--deckA),#1e9e8f 75%);
    display:flex;align-items:center;justify-content:center;
    flex:none;
  }
  .brand-mark svg{width:19px;height:19px;}
  .brand h1{
    font-weight:800;
    font-size:1.15rem;
    margin:0;
    line-height:1;
  }
  .brand p{margin:3px 0 0; color:var(--text-dim); font-size:.76rem;}

  /* ---------- Auto DJ toggle + status ---------- */
  .autodj{display:flex; flex-direction:column; align-items:flex-end; gap:4px; max-width:260px;}
  .autodj-btn{
    font-family:'JetBrains Mono',monospace; font-size:.72rem; font-weight:700; letter-spacing:.4px;
    padding:8px 14px; border-radius:10px; cursor:pointer; white-space:nowrap;
    background:var(--panel-2); border:1.5px solid var(--line-2); color:var(--text-dim);
    transition:background .15s, border-color .15s, color .15s;
  }
  .autodj-btn.on{background:rgba(255,184,77,.14); border-color:var(--gold); color:var(--gold);}
  .autodj-status{
    font-size:.68rem; line-height:1.4; color:var(--text-faint); text-align:right;
    max-width:260px; display:none; unicode-bidi:plaintext;
  }
  @media (max-width:900px){ .autodj{align-items:flex-start; max-width:100%;} .autodj-status{text-align:left; max-width:100%;} }

  /* ---------- Auto DJ: NEXT MIX transition preview ---------- */
  .nextmix{
    display:none; flex-direction:column; gap:8px;
    background:var(--panel-2); border:1px solid var(--line-2); border-radius:12px;
    padding:12px 14px; flex:none;
  }
  .nextmix-head{display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;}
  .nextmix-badge{
    font-family:'JetBrains Mono',monospace; font-size:.66rem; font-weight:700; letter-spacing:.6px;
    color:var(--gold); background:rgba(255,184,77,.14); border:1px solid var(--gold);
    border-radius:6px; padding:2px 7px; flex:none;
  }
  .nextmix-strategy{font-family:'JetBrains Mono',monospace; font-size:.72rem; font-weight:700; color:var(--text);}
  .nextmix-tracks{font-size:.86rem; font-weight:600; unicode-bidi:plaintext;}
  .nextmix-meta{font-family:'JetBrains Mono',monospace; font-size:.68rem; color:var(--text-dim); unicode-bidi:plaintext;}
  .nextmix-reason{font-size:.72rem; color:var(--text-faint); unicode-bidi:plaintext;}
  .nextmix-actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:2px;}
  .nextmix-btn{
    font-family:'JetBrains Mono',monospace; font-size:.68rem; font-weight:700; letter-spacing:.3px;
    padding:7px 12px; border-radius:8px; cursor:pointer;
    background:var(--panel-3); border:1.5px solid var(--line-2); color:var(--text-dim);
  }
  .nextmix-btn:hover{color:var(--text);}
  .nextmix-btn-execute{background:rgba(53,215,196,.14); border-color:var(--deckA); color:var(--deckA);}

  /* ---------- mixer console ---------- */
  .mixer{
    flex:1;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:26px;
    box-shadow:var(--shadow);
    padding:16px;
    display:grid;
    grid-template-columns: 1fr minmax(230px,300px) 1fr;
    grid-template-rows: auto 1fr auto;
    gap:10px 14px;
    align-content:center;
  }
  @media (max-width:900px){
    .mixer{
      display:flex;
      flex-direction:column;
      gap:14px;
      padding:14px;
    }
  }

  .deck{grid-row:1 / span 3; display:flex; flex-direction:column; gap:10px; min-width:0;}
  .deck.deck-a{grid-column:1;}
  .deck.deck-b{grid-column:3;}
  @media (max-width:900px){
    .deck.deck-a{order:1;}
    .deck.deck-b{order:3;}
  }

  .deck-head{display:flex; align-items:center; gap:8px; min-width:0;}
  .deck-title{
    flex:none;
    max-width:38%;
    font-size:.82rem;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    unicode-bidi:plaintext; /* track names are often Latin filenames; without
      this the RTL page direction truncates them from the wrong end */
  }
  .deck.deck-a .deck-title{color:var(--deckA);}
  .deck.deck-b .deck-title{color:var(--deckB);}
  .deck-wave{
    flex:1;
    min-width:0;
    height:34px;
    border-radius:8px;
    background:var(--panel-2);
    border:1px solid var(--line);
    display:block;
  }
  .deck-bpm{
    flex:none;
    font-family:'JetBrains Mono',monospace;
    font-size:.68rem;
    font-weight:700;
    color:var(--text-dim);
    background:var(--panel-2);
    border:1px solid var(--line-2);
    border-radius:7px;
    padding:3px 7px;
    font-variant-numeric:tabular-nums;
  }

  .wheel-wrap{
    flex:1;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:6px;
    min-height:0;
    padding:6px 0;
  }
  .wheel-outer{
    position:relative;
    width:min(180px, 40vw);
    aspect-ratio:1/1;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #2a2c35, #101116 72%);
    box-shadow:inset 0 0 0 1px var(--line), 0 14px 30px -14px rgba(0,0,0,.7);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .wheel-outer canvas{
    width:88%; height:88%;
    border-radius:50%;
    filter:drop-shadow(0 6px 14px rgba(0,0,0,.5));
  }
  .wheel-rw{font-size:.62rem; color:var(--text-faint); letter-spacing:1px; display:flex; justify-content:space-between; width:min(180px,40vw);}

  .deck-transport{display:flex; gap:6px;}
  .dbtn{
    flex:1;
    display:flex; flex-direction:column; align-items:center; gap:2px;
    background:var(--panel-2);
    border:1px solid var(--line-2);
    border-radius:10px;
    padding:8px 4px;
    color:var(--text-dim);
    font-size:.66rem;
    font-weight:700;
    letter-spacing:.3px;
    cursor:pointer;
    transition:filter .15s, border-color .15s, color .15s;
  }
  .dbtn svg{width:14px;height:14px;}
  .dbtn:disabled{opacity:.35; cursor:not-allowed;}
  .dbtn.play:not(:disabled){color:var(--text);}
  .deck.deck-a .dbtn.play.is-on{border-color:var(--deckA); background:var(--deckA-soft); color:var(--deckA);}
  .deck.deck-b .dbtn.play.is-on{border-color:var(--deckB); background:var(--deckB-soft); color:var(--deckB);}
  .dbtn.sync:not(:disabled):hover, .dbtn.cue:not(:disabled):hover{border-color:var(--line-2); color:var(--text);}

  /* ---------- pad bank: mode tabs + 4 context pads ---------- */
  .pad-tabs{display:flex; gap:4px;}
  .ptab{
    flex:1; background:var(--panel-2); border:1px solid var(--line); border-radius:7px;
    color:var(--text-faint); font-size:.6rem; font-weight:700; padding:5px 2px; cursor:pointer;
  }
  .ptab.active{color:var(--text); border-color:var(--line-2); background:var(--panel-3);}
  .deck.deck-a .ptab.active{color:var(--deckA); border-color:var(--deckA);}
  .deck.deck-b .ptab.active{color:var(--deckB); border-color:var(--deckB);}
  .pad-grid{display:flex; gap:5px;}
  .pad{
    flex:1; height:34px; border-radius:8px;
    background:var(--panel-2); border:1px solid var(--line-2); color:var(--text-dim);
    font-family:'JetBrains Mono',monospace; font-size:.68rem; font-weight:700; cursor:pointer;
    user-select:none; -webkit-user-select:none; touch-action:manipulation;
  }
  .pad:disabled{opacity:.3; cursor:not-allowed;}
  .deck.deck-a .pad.set{background:var(--deckA-soft); border-color:var(--deckA); color:var(--deckA);}
  .deck.deck-b .pad.set{background:var(--deckB-soft); border-color:var(--deckB); color:var(--deckB);}

  /* ---------- channel knobs: EQ x3 + color filter + tempo fader ---------- */
  .deck-knobs{display:flex; flex-direction:column; gap:4px;}
  .knob-row{display:flex; align-items:center; gap:7px;}
  .klabel{
    flex:none; width:34px; font-size:.6rem; font-weight:700; color:var(--text-faint);
    letter-spacing:.3px; text-align:center;
  }
  .kslider{height:4px;}
  .kslider::-webkit-slider-thumb{width:11px;height:11px;}
  .deck.deck-a .kslider::-webkit-slider-thumb, .deck.deck-a .kslider::-moz-range-thumb{background:var(--deckA);}
  .deck.deck-b .kslider::-webkit-slider-thumb, .deck.deck-b .kslider::-moz-range-thumb{background:var(--deckB);}
  .tempo-row .klabel{color:var(--gold);}
  .tempo-row .kslider::-webkit-slider-thumb, .tempo-row .kslider::-moz-range-thumb{background:var(--gold);}

  /* ---------- center column ---------- */
  .center-body{
    grid-column:2; grid-row:1 / span 2;
    display:flex; flex-direction:column; gap:10px;
    min-height:0;
  }
  @media (max-width:900px){ .center-body{order:2;} }

  .fader-row{display:flex; align-items:center; gap:8px;}
  .onair{
    flex:none;
    display:flex; align-items:center; gap:5px;
    font-family:'JetBrains Mono',monospace;
    font-size:.6rem; font-weight:700; letter-spacing:.5px;
    color:var(--text-faint);
    background:var(--panel-2);
    border:1px solid var(--line-2);
    border-radius:7px;
    padding:4px 7px;
  }
  .onair .d{width:6px;height:6px;border-radius:50%; background:var(--text-faint);}
  .onair.live.a{color:var(--deckA); border-color:var(--deckA);}
  .onair.live.a .d{background:var(--deckA); box-shadow:0 0 8px var(--deckA);}
  .onair.live.b{color:var(--deckB); border-color:var(--deckB);}
  .onair.live.b .d{background:var(--deckB); box-shadow:0 0 8px var(--deckB);}
  .crossfader{
    flex:1;
    -webkit-appearance:none; appearance:none;
    height:8px; border-radius:999px; outline:none;
    background:linear-gradient(to left, var(--deckA), var(--panel-3) 46%, var(--panel-3) 54%, var(--deckB));
  }
  .crossfader::-webkit-slider-thumb{
    -webkit-appearance:none; width:18px; height:18px; border-radius:6px;
    background:var(--text); border:2px solid var(--panel); cursor:grab;
    box-shadow:0 2px 6px rgba(0,0,0,.5);
  }
  .crossfader::-moz-range-thumb{
    width:18px; height:18px; border-radius:6px;
    background:var(--text); border:2px solid var(--panel); cursor:grab;
  }

  .library{
    flex:1;
    min-height:220px;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:14px;
    padding:12px;
    display:flex; flex-direction:column;
    min-width:0;
  }
  .library-head{
    flex:none;
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:8px;
  }
  .library-head .lbl{font-size:.7rem; font-weight:800; letter-spacing:1px; color:var(--text-dim);}
  .library-head .cnt{
    font-family:'JetBrains Mono',monospace; font-size:.66rem; color:var(--text-faint);
  }
  .add-btn{
    flex:none;
    width:24px;height:24px;border-radius:7px;
    background:var(--panel-3); border:1px solid var(--line-2); color:var(--text-dim);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .add-btn svg{width:13px;height:13px;}
  input[type=file]{display:none;}

  .dropzone{
    flex:none;
    border:1.3px dashed var(--line-2);
    border-radius:10px;
    padding:12px 8px;
    text-align:center;
    cursor:pointer;
    font-size:.72rem;
    color:var(--text-dim);
    margin-bottom:8px;
    transition:border-color .2s, color .2s;
  }
  .dropzone:hover, .dropzone.drag{border-color:var(--deckA); color:var(--deckA);}

  .plist{
    flex:1; overflow-y:auto; min-height:0;
    display:flex; flex-direction:column; gap:2px;
    margin:0 -4px; padding:0 4px;
  }
  .plist:empty::after{content:"لسه ما رفعت أغاني"; color:var(--text-faint); font-size:.78rem; padding:14px 0; text-align:center; display:block;}
  .prow{
    display:flex; align-items:center; gap:6px;
    padding:6px 5px;
    border-radius:8px;
    font-size:.76rem;
  }
  .prow:hover{background:var(--panel-3);}
  .prow.on-a{color:var(--deckA); background:var(--deckA-soft);}
  .prow.on-b{color:var(--deckB); background:var(--deckB-soft);}
  .loadpill{flex:none; display:flex; border:1px solid var(--line-2); border-radius:6px; overflow:hidden;}
  .loadbtn{
    width:16px; height:20px; display:flex; align-items:center; justify-content:center;
    font-family:'JetBrains Mono',monospace; font-size:.62rem; font-weight:800;
    background:var(--panel-3); color:var(--text-faint); border:none; cursor:pointer; padding:0;
  }
  .loadbtn.a:hover, .loadbtn.a.active{background:var(--deckA-soft); color:var(--deckA);}
  .loadbtn.b:hover, .loadbtn.b.active{background:var(--deckB-soft); color:var(--deckB);}
  .prow .pname{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; unicode-bidi:plaintext;}
  .prow .pstars{flex:none; display:flex; gap:1px;}
  .prow .pstar{width:12px;height:12px; cursor:pointer; color:var(--line-2);}
  .prow .pstar.on{color:var(--gold);}
  .prow .pbpm{flex:none; font-family:'JetBrains Mono',monospace; font-size:.64rem; color:var(--text-faint); min-width:26px; text-align:left;}
  .prow .ptime{flex:none; font-family:'JetBrains Mono',monospace; font-size:.68rem; color:var(--text-dim); min-width:36px; text-align:left; font-variant-numeric:tabular-nums;}
  .prow.on-a .ptime, .prow.on-b .ptime{color:inherit; font-weight:700;}
  .prow .pdel{
    flex:none; width:17px;height:17px; border-radius:5px;
    display:flex; align-items:center; justify-content:center;
    color:var(--text-faint); cursor:pointer; background:transparent; border:none;
  }
  .prow .pdel:hover{color:var(--danger); background:rgba(255,107,107,.12);}
  .prow .pdel[disabled]{visibility:hidden;}
  .prow .pspin{width:11px;height:11px;border-radius:50%; border:2px solid var(--line-2); border-top-color:var(--deckA); animation:spin .8s linear infinite; flex:none;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ---------- beat strip (visual beatmatching aid, not automation) ------- */
  .beat-strip{
    grid-column:2; grid-row:3;
    display:flex; align-items:center; gap:2px;
    height:26px;
    padding:0 4px;
  }
  @media (max-width:900px){ .beat-strip{order:4; align-self:center; width:100%; max-width:300px;} }
  .beat-tick{flex:1; height:8px; border-radius:2px; background:var(--panel-3); transition:height .06s, background .06s;}

  /* ---------- transport (volume) ---------- */
  .transport{
    position:fixed; right:0; left:0; bottom:0;
    padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));
    background:linear-gradient(180deg, rgba(11,12,16,0), rgba(11,12,16,.95) 30%, #0b0c10 62%);
    display:flex; justify-content:center;
    z-index:20;
  }
  .transport-inner{
    width:100%; max-width:520px;
    background:var(--panel);
    border:1px solid var(--line-2);
    border-radius:16px;
    padding:9px 13px;
    display:flex; align-items:center; gap:12px;
    box-shadow:var(--shadow);
  }
  .transport-inner svg{width:15px;height:15px;color:var(--text-dim); flex:none;}
  input[type=range]{
    -webkit-appearance:none; appearance:none; flex:1;
    height:4px; border-radius:999px; background:var(--panel-2); outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:13px;height:13px;border-radius:50%;
    background:var(--deckA); cursor:pointer; border:2px solid var(--panel);
  }
  input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%; background:var(--deckA); border:2px solid var(--panel); cursor:pointer;}
  .tlabel{font-family:'JetBrains Mono',monospace; font-size:.68rem; color:var(--text-faint); flex:none;}

  ::-webkit-scrollbar{width:7px;height:7px;}
  ::-webkit-scrollbar-thumb{background:var(--panel-3); border-radius:8px;}
</style>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none"><path d="M9 18V6l11-2v12" stroke="#04231f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6" cy="18" r="3" stroke="#04231f" stroke-width="1.8"/><circle cx="17" cy="16" r="3" stroke="#04231f" stroke-width="1.8"/></svg>
      </div>
      <div>
        <h1>نبضة DJ</h1>
        <p>حمّل الأغاني على الديكات وتحكم بالميكس بإيدك بالكامل</p>
      </div>
    </div>
    <div class="autodj">
      <button class="autodj-btn" id="autoDjBtn" type="button">AUTO DJ ON</button>
      <div class="autodj-status" id="autoDjStatus"></div>
    </div>
  </header>

  <div class="nextmix" id="nextMixPanel">
    <div class="nextmix-head">
      <span class="nextmix-badge">NEXT MIX</span>
      <span class="nextmix-strategy" id="nextMixStrategy"></span>
    </div>
    <div class="nextmix-tracks" id="nextMixTracks"></div>
    <div class="nextmix-meta" id="nextMixMeta"></div>
    <div class="nextmix-reason" id="nextMixReason"></div>
    <div class="nextmix-actions">
      <button type="button" class="nextmix-btn nextmix-btn-execute" id="nextMixExecute">EXECUTE</button>
      <button type="button" class="nextmix-btn" id="nextMixSkip">SKIP</button>
      <button type="button" class="nextmix-btn" id="nextMixChange">CHANGE TRACK</button>
    </div>
  </div>

  <div class="mixer" id="mixer">
    <!-- Deck A (right) -->
    <div class="deck deck-a">
      <div class="deck-head">
        <div class="deck-title" id="titleA">فاضي</div>
        <canvas class="deck-wave" id="waveA" width="300" height="60"></canvas>
        <div class="deck-bpm" id="bpmA">-- BPM</div>
      </div>
      <div class="wheel-wrap">
        <div class="wheel-outer" id="wheelWrapA"><canvas id="wheelA" width="220" height="220"></canvas></div>
        <div class="wheel-rw"><span>REV</span><span>FWD</span></div>
      </div>
      <div class="deck-transport">
        <button class="dbtn play" id="playA" disabled>
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          تشغيل
        </button>
        <button class="dbtn cue" id="cueA" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5v14"/><path d="M19 12L7 5v14z"/></svg>
          كيو
        </button>
        <button class="dbtn sync" id="syncA" disabled title="يزبط سرعة هاد الديك على الديك التاني">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v6h6"/><path d="M20 20v-6h-6"/><path d="M5 15a8 8 0 0014 4.5M19 9A8 8 0 005 4.5"/></svg>
          مزامنة
        </button>
      </div>
      <div class="pad-tabs" id="padTabsA">
        <button class="ptab active" data-mode="hotcue">كيوز</button>
        <button class="ptab" data-mode="fx">إفكتات</button>
        <button class="ptab" data-mode="loop">لووب</button>
        <button class="ptab" data-mode="sampler">سامبلر</button>
      </div>
      <div class="pad-grid" id="padsA"></div>
      <div class="deck-knobs">

<script>
(function(){
  "use strict";

  /* =========================================================================
     ENGINE CORE — analysis only. No autonomous ordering or auto-mixing:
     these are pure functions used to INFORM the person (BPM per track) and
     to power the manual SYNC button, which only ever runs when clicked.
     Unit-tested against synthetic tracks before being wired in below.
     ========================================================================= */

  function detectBeats(samples, sampleRate) {
    const blockSize = 1024;
    const historyBlocks = 43;
    const minBpm = 70;
    const maxBpm = 190;
    const minIoi = 60 / 260;

    const nBlocks = Math.floor(samples.length / blockSize);
    const energies = new Float64Array(nBlocks);
    for (let b = 0; b < nBlocks; b++) {
      let sum = 0;
      const start = b * blockSize;
      for (let i = 0; i < blockSize; i++) {
        const s = samples[start + i];
        sum += s * s;
      }
      energies[b] = sum;
    }

    const beatTimes = [];
    let lastBeatTime = -Infinity;
    const hist = [];
    for (let b = 0; b < nBlocks; b++) {
      hist.push(energies[b]);
      if (hist.length > historyBlocks) hist.shift();
      const avg = hist.reduce((a, v) => a + v, 0) / hist.length;
      if (avg <= 1e-9) continue;
      let variance = 0;
      for (const v of hist) variance += (v - avg) * (v - avg);
      variance /= hist.length;
      const relVar = variance / (avg * avg);
      let C = 1.3 - relVar * 0.5;
      if (C < 1.05) C = 1.05;
      if (C > 1.8) C = 1.8;
      const t = (b * blockSize) / sampleRate;
      if (energies[b] > C * avg && t - lastBeatTime >= minIoi) {
        beatTimes.push(t);
        lastBeatTime = t;
      }
    }

    if (beatTimes.length < 4) {
      return { bpm: 120, beatTimes, firstBeat: beatTimes[0] || 0, confidence: 0 };
    }

    const minIvl = 60 / maxBpm;
    const maxIvl = 60 / minBpm;
    const ivlVotes = new Map();
    const rawVotes = [];
    const bucket = (ivl) => Math.round(ivl / 0.01) * 0.01;

    for (let i = 0; i < beatTimes.length; i++) {
      for (let span = 1; span <= 3; span++) {
        const j = i + span;
        if (j >= beatTimes.length) break;
        let ioi = (beatTimes[j] - beatTimes[i]) / span;
        if (ioi <= 0) continue;
        while (ioi < minIvl) ioi *= 2;
        while (ioi > maxIvl) ioi /= 2;
        const key = bucket(ioi);
        const weight = 1 / span;
        ivlVotes.set(key, (ivlVotes.get(key) || 0) + weight);
        rawVotes.push({ ivl: ioi, weight, key });
      }
    }

    let bestKey = bucket(60 / 120);
    let bestScore = -1;
    let totalScore = 0;
    for (const [key, score] of ivlVotes) {
      totalScore += score;
      if (score > bestScore) { bestScore = score; bestKey = key; }
    }
    const confidence = totalScore > 0 ? bestScore / totalScore : 0;

    let wSum = 0, wIvlSum = 0;
    for (const v of rawVotes) {
      if (Math.abs(v.key - bestKey) <= 0.02) { wSum += v.weight; wIvlSum += v.weight * v.ivl; }
    }
    const bestIvl = wSum > 0 ? wIvlSum / wSum : bestKey;
    let bestBpm = Math.round((60 / bestIvl) * 10) / 10;

    return { bpm: bestBpm, beatTimes, firstBeat: beatTimes[0], confidence };
  }

  // Only used by the manual SYNC button, on click — never invoked on its own.
  function computeSyncRate(bpmA, bpmB, maxStretch) {
    maxStretch = maxStretch || 0.08;
    const multipliers = [1, 0.5, 2];
    let best = { rate: 1, error: Infinity };
    for (const m of multipliers) {
      const rate = bpmA / (bpmB * m);
      const error = Math.abs(rate - 1);
      if (error < best.error) best = { rate, error };
    }
    const clamped = Math.min(1 + maxStretch, Math.max(1 - maxStretch, best.rate));
    return { rate: clamped, matched: best.error <= maxStretch };
  }

  // Position math for an independently playable/pausable deck — unit tested
  // separately (a source node can only start once and can't be paused, so
  // "pause" is stop()+remember offset, "play" is start(now, offset)).
  function rawElapsed(meta, now) {
    if (!meta.playing) return meta.offset;
    return meta.offset + (now - meta.playStartedAt) * meta.rate;
  }
  // Wraps the raw position into the active loop window, if any. Loop bounds
  // are in the same buffer-time coordinates as everything else here.
  function wrapInLoop(raw, loop) {
    if (!loop || !loop.active) return raw;
    if (raw < loop.start) return raw;
    const rel = (raw - loop.start) % loop.len;
    return loop.start + rel;
  }
  function deckElapsed(meta, now) {
    return wrapInLoop(rawElapsed(meta, now), meta.loop);
  }
  function loopLength(beats, trackBpm) { return beats * (60 / trackBpm); }

  // ---- EQ / color-filter / tempo-fader pure math (unit tested in
  // controls.js before being wired to real BiquadFilterNodes below) --------
  function eqGainDb(sliderValue) {
    const v = Math.max(-1, Math.min(1, sliderValue));
    return v >= 0 ? v * 6 : v * 26;
  }
  function colorFilterParams(sliderValue) {
    const v = Math.max(-1, Math.min(1, sliderValue));
    if (v === 0) return { type: 'lowpass', freq: 20000 };
    if (v < 0) { const t = -v; return { type: 'lowpass', freq: 20000 * Math.pow(200 / 20000, t) }; }
    const t = v; return { type: 'highpass', freq: 20 * Math.pow(4000 / 20, t) };
  }
  function tempoRate(percentValue) { return 1 + Math.max(-8, Math.min(8, percentValue)) / 100; }
  function rateToTempoPercent(rate) { return Math.max(-8, Math.min(8, (rate - 1) * 100)); }

  /* =========================================================================
     DJ INTELLIGENCE — per-track analysis + next-track selection math for
     Auto DJ mode. All pure functions, unit-tested standalone (chromaKey.js,
     trackFeatures.js, trackSelector.js, autoDjEngine.js + their test_*.js)
     before being pasted in here. Honesty notes on what's real DSP vs.
     heuristic are in the header comments of those source files; the short
     version: BPM/beatgrid/key/loudness/spectral-balance are genuine (if
     simple) signal analysis; section labels and "style similarity" are
     heuristic proxies, not content-aware structure/genre detection.
     ========================================================================= */

  // ---- chromaKey.js: musical key via a tuned-Goertzel chromagram + the
  // Krumhansl-Schmuckler key-finding algorithm, plus Camelot-wheel scoring.
  const MAJOR_PROFILE = [6.35, 2.23, 3.48, 2.33, 4.38, 4.09, 2.52, 5.19, 2.39, 3.66, 2.29, 2.88];
  const MINOR_PROFILE = [6.33, 2.68, 3.52, 5.38, 2.60, 3.53, 2.54, 4.75, 3.98, 2.69, 3.34, 3.17];
  const PITCH_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
  const MAJOR_CAMELOT = ['8B', '3B', '10B', '5B', '12B', '7B', '2B', '9B', '4B', '11B', '6B', '1B'];
  const MINOR_CAMELOT = ['5A', '12A', '7A', '2A', '9A', '4A', '11A', '6A', '1A', '8A', '3A', '10A'];

  function computeChroma(samples, sampleRate, maxFrames) {
    maxFrames = maxFrames || 40;
    const frameSize = 4096;
    const minMidi = 36, maxMidi = 96;
    const chroma = new Array(12).fill(0);
    if (samples.length < frameSize) return chroma;
    const maxStart = samples.length - frameSize;
    const nFrames = Math.min(maxFrames, Math.max(1, Math.floor(samples.length / frameSize)));
    const step = nFrames > 1 ? maxStart / (nFrames - 1) : 0;
    const freqs = [];
    for (let m = minMidi; m <= maxMidi; m++) freqs.push(440 * Math.pow(2, (m - 69) / 12));
    for (let f = 0; f < nFrames; f++) {
      const start = Math.round(f * step);
      for (let ni = 0; ni < freqs.length; ni++) {
        const freq = freqs[ni];
        const w = (2 * Math.PI * freq) / sampleRate;
        let re = 0, im = 0;
        for (let i = 0; i < frameSize; i++) {
          const s = samples[start + i];
          re += s * Math.cos(w * i);
          im -= s * Math.sin(w * i);
        }
        const mag = Math.sqrt(re * re + im * im) / frameSize;
        chroma[(minMidi + ni) % 12] += mag;
      }
    }
    const max = Math.max.apply(null, chroma.concat([1e-9]));
    return chroma.map((v) => v / max);
  }
  function pearson(a, b) {
    const n = a.length;
    const meanA = a.reduce((s, v) => s + v, 0) / n;
    const meanB = b.reduce((s, v) => s + v, 0) / n;
    let num = 0, dA = 0, dB = 0;
    for (let i = 0; i < n; i++) {
      const da = a[i] - meanA, db = b[i] - meanB;
      num += da * db; dA += da * da; dB += db * db;
    }
    const denom = Math.sqrt(dA * dB);
    return denom > 1e-9 ? num / denom : 0;
  }
  function detectKey(chroma) {
    let best = { pitchClass: 0, mode: 'major', correlation: -Infinity };
    for (let root = 0; root < 12; root++) {
      const rotMajor = Array.from({ length: 12 }, (_, i) => MAJOR_PROFILE[(i - root + 12) % 12]);
      const rotMinor = Array.from({ length: 12 }, (_, i) => MINOR_PROFILE[(i - root + 12) % 12]);
      const corrMajor = pearson(chroma, rotMajor);
      const corrMinor = pearson(chroma, rotMinor);
      if (corrMajor > best.correlation) best = { pitchClass: root, mode: 'major', correlation: corrMajor };
      if (corrMinor > best.correlation) best = { pitchClass: root, mode: 'minor', correlation: corrMinor };
    }
    const camelot = (best.mode === 'major' ? MAJOR_CAMELOT : MINOR_CAMELOT)[best.pitchClass];
    const name = PITCH_NAMES[best.pitchClass] + (best.mode === 'minor' ? 'm' : '');
    return { pitchClass: best.pitchClass, name, mode: best.mode, camelot, correlation: best.correlation };
  }
  function parseCamelot(code) {
    const m = /^(\d{1,2})([AB])$/.exec(code || '');
    if (!m) return null;
    return { num: parseInt(m[1], 10), letter: m[2] };
  }
  function camelotCompatibility(codeA, codeB) {
    const a = parseCamelot(codeA), b = parseCamelot(codeB);
    if (!a || !b) return 0.5;
    if (a.num === b.num && a.letter === b.letter) return 1;
    if (a.num === b.num && a.letter !== b.letter) return 0.85;
    let diff = Math.abs(a.num - b.num);
    diff = Math.min(diff, 12 - diff);
    if (diff === 1 && a.letter === b.letter) return 0.8;
    let score = Math.max(0, 1 - diff / 6);
    if (a.letter !== b.letter) score *= 0.5;
    return score;
  }

  // ---- trackFeatures.js: loudness, a cheap 3-band spectral-balance proxy,
  // and grid-based (not content-based) downbeat/phrase/section guesses.
  function computeRMS(samples) {
    if (!samples || samples.length === 0) return { rms: 0, db: -Infinity };
    let sum = 0;
    for (let i = 0; i < samples.length; i++) sum += samples[i] * samples[i];
    const rms = Math.sqrt(sum / samples.length);
    const db = rms > 1e-9 ? 20 * Math.log10(rms) : -Infinity;
    return { rms, db };
  }
  function computeLoudnessCurve(samples, sampleRate, windowSeconds) {
    windowSeconds = windowSeconds || 1;
    const windowSize = Math.max(1, Math.round(windowSeconds * sampleRate));
    const curve = [];
    for (let start = 0; start < samples.length; start += windowSize) {
      const end = Math.min(samples.length, start + windowSize);
      let sum = 0;
      for (let i = start; i < end; i++) sum += samples[i] * samples[i];
      curve.push({ time: start / sampleRate, rms: Math.sqrt(sum / (end - start)) });
    }
    return curve;
  }
  function onePoleLowpass(samples, sampleRate, cutoffHz) {
    const dt = 1 / sampleRate, rc = 1 / (2 * Math.PI * cutoffHz), alpha = dt / (rc + dt);
    const out = new Float32Array(samples.length);
    let y = 0;
    for (let i = 0; i < samples.length; i++) { y = y + alpha * (samples[i] - y); out[i] = y; }
    return out;
  }
  function onePoleHighpass(samples, sampleRate, cutoffHz) {
    const dt = 1 / sampleRate, rc = 1 / (2 * Math.PI * cutoffHz), alpha = rc / (rc + dt);
    const out = new Float32Array(samples.length);
    let y = 0, prevX = samples.length ? samples[0] : 0;
    for (let i = 0; i < samples.length; i++) { y = alpha * (y + samples[i] - prevX); prevX = samples[i]; out[i] = y; }
    return out;
  }
  function computeSpectralBalance(samples, sampleRate, lowCutoff, highCutoff) {
    lowCutoff = lowCutoff || 250; highCutoff = highCutoff || 4000;
    if (!samples || samples.length === 0) return { low: 0, mid: 0, high: 0 };
    const low = onePoleLowpass(samples, sampleRate, lowCutoff);
    const aboveLow = onePoleHighpass(samples, sampleRate, lowCutoff);
    const mid = onePoleLowpass(aboveLow, sampleRate, highCutoff);
    const high = onePoleHighpass(aboveLow, sampleRate, highCutoff);
    const eLow = computeRMS(low).rms, eMid = computeRMS(mid).rms, eHigh = computeRMS(high).rms;
    const total = eLow + eMid + eHigh || 1e-9;
    return { low: eLow / total, mid: eMid / total, high: eHigh / total };
  }
  function computeDownbeats(bpm, firstBeat, duration, beatsPerBar) {
    beatsPerBar = beatsPerBar || 4;
    if (!bpm || bpm <= 0 || duration <= 0) return [];
    const barLen = (60 / bpm) * beatsPerBar;
    const downbeats = [];
    let start = firstBeat;
    while (start - barLen >= 0) start -= barLen;
    for (let t = start; t < duration; t += barLen) if (t >= 0) downbeats.push(t);
    return downbeats;
  }
  function computePhraseBoundaries(downbeats, barsPerPhrase) {
    barsPerPhrase = barsPerPhrase || 8;
    return downbeats.filter((_, i) => i % barsPerPhrase === 0);
  }
  function segmentSections(loudnessCurve, phraseBoundaries, duration) {
    if (!loudnessCurve.length) return [];
    const bounds = phraseBoundaries.length ? phraseBoundaries.slice() : [0];
    if (bounds[0] > 0.01) bounds.unshift(0);
    const segments = bounds.map((start, i) => ({ start, end: i + 1 < bounds.length ? bounds[i + 1] : duration }));
    const energyOf = (seg) => {
      const pts = loudnessCurve.filter((p) => p.time >= seg.start && p.time < seg.end);
      if (!pts.length) return 0;
      return pts.reduce((s, p) => s + p.rms, 0) / pts.length;
    };
    const energies = segments.map(energyOf);
    const avg = energies.reduce((s, e) => s + e, 0) / (energies.length || 1);
    const peak = Math.max.apply(null, energies.concat([1e-9]));
    return segments.map((seg, i) => {
      const energy = energies[i], rel = energy / peak;
      let label;
      if (i === 0) label = rel > 0.75 ? 'intro-hot' : 'intro';
      else if (i === segments.length - 1) label = rel > 0.6 ? 'outro-hot' : 'outro';
      else {
        const prev = energies[i - 1];
        const next = i + 1 < energies.length ? energies[i + 1] : energy;
        if (rel >= 0.85) label = 'drop';
        else if (energy < avg * 0.6) label = 'breakdown';
        else if (next > energy * 1.15 && next >= avg) label = 'buildup';
        else if (energy > prev * 1.1) label = 'buildup';
        else label = 'verse';
      }
      return { start: seg.start, end: seg.end, label, energy };
    });
  }
  function analyzeStructure(samples, sampleRate, bpm, firstBeat, duration) {
    const loudness = computeRMS(samples);
    const curve = computeLoudnessCurve(samples, sampleRate, 1);
    const spectral = computeSpectralBalance(samples, sampleRate);
    const downbeats = computeDownbeats(bpm, firstBeat, duration);
    const phraseBoundaries = computePhraseBoundaries(downbeats);
    const sections = segmentSections(curve, phraseBoundaries, duration);
    return { loudness, spectral, downbeats, phraseBoundaries, sections, curve };
  }

  // ---- trackSelector.js: next-track scoring. "Style similarity" is
  // explicitly a spectral-balance proxy, not a genre classifier.
  function bpmCompatibility(bpmA, bpmB, tolerancePercent) {
    tolerancePercent = tolerancePercent || 6;
    if (!bpmA || !bpmB) return 0.5;
    const diffPct = (ratio) => Math.abs(ratio - 1) * 100;
    const candidates = [bpmB, bpmB * 2, bpmB / 2];
    let best = 0;
    for (const c of candidates) {
      const pct = diffPct(c / bpmA);
      const score = pct <= tolerancePercent ? 1 : Math.max(0, 1 - (pct - tolerancePercent) / 20);
      if (score > best) best = score;
    }
    return best;
  }
  function energyFlowScore(energyA, energyB) {
    if (energyA == null || energyB == null) return 0.5;
    const diff = energyB - energyA, absDiff = Math.abs(diff);
    let score = Math.max(0, 1 - absDiff * 2.2);
    if (diff > 0 && diff < 0.25) score = Math.min(1, score + 0.08);
    return score;
  }
  function spectralSimilarity(a, b) {
    if (!a || !b) return 0.5;
    const va = [a.low, a.mid, a.high], vb = [b.low, b.mid, b.high];
    const dot = va.reduce((s, v, i) => s + v * vb[i], 0);
    const magA = Math.sqrt(va.reduce((s, v) => s + v * v, 0));
    const magB = Math.sqrt(vb.reduce((s, v) => s + v * v, 0));
    if (magA < 1e-9 || magB < 1e-9) return 0.5;
    return Math.max(0, Math.min(1, dot / (magA * magB)));
  }
  function parseArtistTitle(filename) {

  // ---- phraseAnalysis.js: novelty curve (spectral+energy+rhythmic-
  // density change) snaps 8/16/32-bar phrase boundaries to real detected

  function computeBarFrames(samples, sampleRate, barLen) {
    const barSize = Math.max(1, Math.round(barLen * sampleRate));
