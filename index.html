  // (up to 4 parallel wet sends) -> deck.gain (the ONLY node the crossfader
  // ever touches) -> master.
  function buildDeckAudioChain(key) {
    const deck = decks[key];
    const low = ctx.createBiquadFilter(); low.type = 'lowshelf'; low.frequency.value = 200; low.gain.value = 0;
    const mid = ctx.createBiquadFilter(); mid.type = 'peaking'; mid.frequency.value = 1000; mid.Q.value = 1; mid.gain.value = 0;
    const high = ctx.createBiquadFilter(); high.type = 'highshelf'; high.frequency.value = 2500; high.gain.value = 0;
    const color = ctx.createBiquadFilter(); color.type = 'lowpass'; color.frequency.value = 20000;
    low.connect(mid); mid.connect(high); high.connect(color);

    // Auto DJ's loudness-matching auto-trim (see loudnessMatch.js / the
    // Realtime Mix Executor) lives here as its OWN gain stage, separate
    // from deck.gain (which the crossfader alone controls) — a channel
    // trim, not a fader move. Manual mixing never touches it; it resets
    // to unity whenever a track is (re)loaded onto this deck.
    const trimGain = ctx.createGain(); trimGain.gain.value = 1;
    color.connect(trimGain);

    const dryGain = ctx.createGain(); dryGain.gain.value = 1;
    trimGain.connect(dryGain); dryGain.connect(deck.gain);

    const echoWet = ctx.createGain(); echoWet.gain.value = 0;
    const echoDelay = ctx.createDelay(1.0); echoDelay.delayTime.value = 0.28;
    const echoFeedback = ctx.createGain(); echoFeedback.gain.value = 0.32;
    trimGain.connect(echoDelay);
    echoDelay.connect(echoFeedback); echoFeedback.connect(echoDelay);
    echoDelay.connect(echoWet); echoWet.connect(deck.gain);

    const filterWet = ctx.createGain(); filterWet.gain.value = 0;
    const filterNode = ctx.createBiquadFilter(); filterNode.type = 'bandpass'; filterNode.frequency.value = 900; filterNode.Q.value = 5;
    const filterLfo = ctx.createOscillator(); filterLfo.frequency.value = 0.45;
    const filterLfoGain = ctx.createGain(); filterLfoGain.gain.value = 650;
    filterLfo.connect(filterLfoGain); filterLfoGain.connect(filterNode.frequency); filterLfo.start();
    trimGain.connect(filterNode); filterNode.connect(filterWet); filterWet.connect(deck.gain);

    const flangerWet = ctx.createGain(); flangerWet.gain.value = 0;
    const flangerDelay = ctx.createDelay(0.02); flangerDelay.delayTime.value = 0.004;
    const flangerFeedback = ctx.createGain(); flangerFeedback.gain.value = 0.45;
    const flangerLfo = ctx.createOscillator(); flangerLfo.frequency.value = 0.22;
    const flangerLfoGain = ctx.createGain(); flangerLfoGain.gain.value = 0.0025;
    flangerLfo.connect(flangerLfoGain); flangerLfoGain.connect(flangerDelay.delayTime); flangerLfo.start();
    trimGain.connect(flangerDelay);
    flangerDelay.connect(flangerFeedback); flangerFeedback.connect(flangerDelay);
    flangerDelay.connect(flangerWet); flangerWet.connect(deck.gain);

    const reverbWet = ctx.createGain(); reverbWet.gain.value = 0;
    const convolver = ctx.createConvolver(); convolver.buffer = getImpulseResponse();
    trimGain.connect(convolver); convolver.connect(reverbWet); reverbWet.connect(deck.gain);

    Object.assign(deck, {
      eqNodes: { low, mid, high }, eqIn: low, colorNode: color, trimGain,
      fxWet: { echo: echoWet, filter: filterWet, flanger: flangerWet, reverb: reverbWet },
    });
  }

  function ensureAudio() {
    if (ctx) return;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = ctx.createGain();
    masterGain.gain.value = (els.volSlider.value / 100);
    // gentle safety limiter: several FX sends can stack up, this just keeps
    // things from harshly clipping when they do.
    compressor = ctx.createDynamicsCompressor();
    compressor.threshold.value = -16; compressor.ratio.value = 3; compressor.attack.value = 0.003; compressor.release.value = 0.25;
    masterGain.connect(compressor); compressor.connect(ctx.destination);
    ['A', 'B'].forEach((key) => {
      const gain = ctx.createGain(); gain.gain.value = 0;
      gain.connect(masterGain);
      Object.assign(decks[key], { gain, src: null, meta: null });
      buildDeckAudioChain(key);
    });
    applyCrossfader();
  }

  // ---- crossfader: the only thing that sets deck gains, ever ---------------
  function applyCrossfader() {
    if (!ctx) return;
    const x = els.crossfader.value / 100; // 0 = full A (right), 1 = full B (left)
    decks.A.gain.gain.value = Math.cos(x * Math.PI / 2);
    decks.B.gain.gain.value = Math.sin(x * Math.PI / 2);
  }

  // ---- file handling / analysis (informational only) -----------------------
  function humanTime(sec) {
    sec = Math.max(0, Math.round(sec));
    const m = Math.floor(sec / 60), s = sec % 60;
    return m + ':' + String(s).padStart(2, '0');
  }
  function humanTimeSigned(sec) { return (sec < 0 ? '-' : '') + humanTime(Math.abs(sec)); }

  function computePeaks(channelData, count) {
    const peaks = new Float32Array(count);
    const chunk = Math.floor(channelData.length / count) || 1;
    for (let i = 0; i < count; i++) {
      let max = 0;
      const start = i * chunk;
      for (let j = 0; j < chunk && start + j < channelData.length; j++) {
        const v = Math.abs(channelData[start + j]);
        if (v > max) max = v;
      }
      peaks[i] = max;
    }
    return peaks;
  }

  function addFiles(fileList) {
    const files = Array.from(fileList).filter((f) => f.type.startsWith('audio') || /\.(mp3|wav|m4a|aac|ogg|flac)$/i.test(f.name));
    if (!files.length) return;
    ensureAudio();
    files.forEach((file) => {
      const track = {
        id: ++uid, file, name: file.name.replace(/\.[a-z0-9]+$/i, ''),
        status: 'analyzing', bpm: null, firstBeat: 0, duration: 0,
        peaksWide: null, audioBuffer: null, rating: 0,
        hotcues: [null, null, null, null],
        // Auto DJ analysis, filled in once beat detection finishes (see
        // analyzeTrack): key/camelot code, loudness, spectral balance,
        // downbeats/phrases/sections, and a best-effort artist guess.
        key: null, structure: null, artist: parseArtistTitle(file.name).artist,
        // V7 additions: novelty-snapped phrase grid, a vocal-presence
        // proxy curve, an approximate loudness figure, and the average
        // rhythmic-density reading (see the "V7 DJ INTELLIGENCE" block).
        phrases: { phrases8: [], phrases16: [], phrases32: [] }, vocalCurve: [], loudnessDb: -Infinity, density: 0,
      };
      track.rating = loadRating(track);
      state.tracks.push(track);
      renderLibrary();
      analyzeTrack(track);
    });
  }

  function analyzeTrack(track) {
    const reader = new FileReader();
    reader.onload = function (e) {
      ensureAudio();
      ctx.decodeAudioData(e.target.result.slice(0)).then((buf) => {
        track.audioBuffer = buf;
        track.duration = buf.duration;
        let mono;
        if (buf.numberOfChannels > 1) {
          const c0 = buf.getChannelData(0), c1 = buf.getChannelData(1);
          mono = new Float32Array(c0.length);
          for (let i = 0; i < c0.length; i++) mono[i] = (c0[i] + c1[i]) * 0.5;
        } else {
          mono = buf.getChannelData(0);
        }
        const analysisLen = Math.min(mono.length, buf.sampleRate * 90);
        const result = detectBeats(mono.subarray(0, analysisLen), buf.sampleRate);
        track.bpm = result.bpm;
        track.firstBeat = result.firstBeat;
        track.confidence = result.confidence;
        track.peaksWide = computePeaks(mono, 90);
        // Auto DJ analysis (see the "DJ INTELLIGENCE" block above for what's
        // genuine DSP vs. heuristic): key from a chromagram, then loudness /
        // spectral-balance / downbeat-grid / phrase / section structure.
        const chroma = computeChroma(mono.subarray(0, analysisLen), buf.sampleRate);
        track.key = detectKey(chroma);
        track.structure = analyzeStructure(mono.subarray(0, analysisLen), buf.sampleRate, track.bpm, track.firstBeat, track.duration);
        // V7: phrase grid (novelty-snapped), vocal-presence curve, and an
        // approximate loudness figure — see the "V7 DJ INTELLIGENCE" block.
        track.phrases = analyzePhrases(mono.subarray(0, analysisLen), buf.sampleRate, track.bpm, track.firstBeat, track.duration);
        track.density = track.phrases.avgDensity;
        track.vocalCurve = vocalPresenceCurve(mono.subarray(0, analysisLen), buf.sampleRate, 2);
        track.loudnessDb = approximateLoudnessDb(mono.subarray(0, analysisLen), buf.sampleRate);
        track.status = 'ready';
        renderLibrary();
      }).catch(() => {
        track.status = 'error';
        renderLibrary();
      });
    };
    reader.readAsArrayBuffer(track.file);
  }

  function isInUse(track) {
    return (decks.A.meta && decks.A.meta.track === track) || (decks.B.meta && decks.B.meta.track === track);
  }

  function deleteTrack(track) {
    if (isInUse(track)) return; // can't remove what's currently on a deck
    state.tracks = state.tracks.filter((t) => t !== track);
    // any sampler pad captured from this track loses its meaning once the
    // track is gone — clear it rather than leave a dangling reference.
    ['A', 'B'].forEach((key) => {
      let changed = false;
      decks[key].samplerSlots.forEach((slot, i) => {
        if (slot && slot.track === track) { decks[key].samplerSlots[i] = null; changed = true; }
      });
      if (changed) renderPadBank(key);
    });
    renderLibrary();
  }

  function setRating(track, val) {
    track.rating = track.rating === val ? 0 : val;
    saveRating(track);
    renderLibrary();
  }

  // ---- deck control: load / play / pause / cue / sync / loop / hotcues -----
  function loadTrackToDeck(track, key) {
    if (!track.audioBuffer) return;
    ensureAudio();
    const deck = decks[key];
    if (deck.src) { try { deck.src.stop(); } catch (e) {} }
    deck.src = null;
    // note: EQ, color filter, FX and pad-mode are deck (channel-strip)
    // settings, not track settings — they deliberately survive a track swap.
    deck.meta = {
      track, rate: 1, effectiveBpm: track.bpm, offset: 0, playing: false, playStartedAt: null,
      loop: { active: false, start: 0, len: 0 },
    };
    // loudness auto-trim is per-transition automation, not a channel
    // setting that should survive a track swap — reset to unity so a
    // freshly (re)loaded track always starts at its natural level.
    if (deck.trimGain) deck.trimGain.gain.cancelScheduledValues(ctx.currentTime);
    if (deck.trimGain) deck.trimGain.gain.setValueAtTime(1, ctx.currentTime);
    applyCrossfader();
    renderLibrary();
    renderDeckFace(key);
    renderPadBank(key);
  }

  function startDeckPlayback(key) {
    const deck = decks[key];
    const now = ctx.currentTime;
    const startOffset = Math.min(deck.meta.offset, Math.max(0, deck.meta.track.duration - 0.02));
    const src = ctx.createBufferSource();
    src.buffer = deck.meta.track.audioBuffer;
    src.playbackRate.value = deck.meta.rate;
    if (deck.meta.loop.active) {
      src.loop = true;
      src.loopStart = deck.meta.loop.start;
      src.loopEnd = deck.meta.loop.start + deck.meta.loop.len;
    }
    src.connect(deck.eqIn);
    src.start(now, startOffset);
    deck.src = src;
    deck.meta = Object.assign({}, deck.meta, { playing: true, playStartedAt: now });
  }

  function stopDeckPlayback(key) {
    const deck = decks[key];
    const now = ctx.currentTime;
    const elapsed = deckElapsed(deck.meta, now);
    if (deck.src) { try { deck.src.stop(now); } catch (e) {} }
    deck.meta = Object.assign({}, deck.meta, { offset: elapsed, playing: false, playStartedAt: null });
  }

  function togglePlay(key) {
    ensureAudio();
    if (ctx.state === 'suspended') ctx.resume();
    const deck = decks[key];
    if (!deck.meta) return;
    if (deck.meta.playing) stopDeckPlayback(key); else startDeckPlayback(key);
    // sampler pads can only capture while playing — keep that affordance live
    if (deck.padMode === 'sampler') renderPadBank(key);
  }

  function cueDeck(key) {
    const deck = decks[key];
    if (!deck.meta) return;
    if (deck.meta.playing) stopDeckPlayback(key);
    deck.meta = Object.assign({}, deck.meta, { offset: 0, playing: false, playStartedAt: null, loop: { active: false, start: 0, len: 0 } });
    renderPadBank(key);
  }

  // Jumps to an arbitrary buffer-time position, resuming playback afterwards
  // if the deck was already playing (used by hot cues). Exits any loop.
  function jumpDeckTo(key, pos) {
    const deck = decks[key];
    if (!deck.meta) return;
    const wasPlaying = deck.meta.playing;
    if (wasPlaying) stopDeckPlayback(key);
    deck.meta = Object.assign({}, deck.meta, { offset: pos, loop: { active: false, start: 0, len: 0 } });
    if (wasPlaying) startDeckPlayback(key);
  }

  function syncDeck(key) {
    const other = key === 'A' ? 'B' : 'A';
    const deck = decks[key], otherDeck = decks[other];
    if (!deck.meta || !otherDeck.meta) return;
    const { rate } = computeSyncRate(otherDeck.meta.effectiveBpm, deck.meta.track.bpm);
    const now = ctx.currentTime;
    const elapsed = deckElapsed(deck.meta, now);
    deck.meta = Object.assign({}, deck.meta, {
      offset: elapsed,
      playStartedAt: deck.meta.playing ? now : null,
      rate,
      effectiveBpm: deck.meta.track.bpm * rate,
    });
    if (deck.src) deck.src.playbackRate.value = rate;
    const slider = key === 'A' ? els.tempoA : els.tempoB;
    slider.value = rateToTempoPercent(rate);
  }

  // ---- manual tempo fader / EQ / color filter -------------------------------
  function setTempo(key, percentValue) {
    const deck = decks[key];
    if (!deck.meta) return;
    const now = ctx.currentTime;
    const rate = tempoRate(percentValue);
    const elapsed = deckElapsed(deck.meta, now);
    deck.meta = Object.assign({}, deck.meta, {
      offset: elapsed, playStartedAt: deck.meta.playing ? now : null,
      rate, effectiveBpm: deck.meta.track.bpm * rate,
    });
    if (deck.src) deck.src.playbackRate.value = rate;
  }

  function setEq(key, band, sliderValue) {
    const deck = decks[key];
    deck.eq[band] = sliderValue;
    if (deck.eqNodes) deck.eqNodes[band].gain.value = eqGainDb(sliderValue);
  }

  function setColorFilter(key, sliderValue) {
    const deck = decks[key];
    deck.colorVal = sliderValue;
    if (!deck.colorNode) return;
    const { type, freq } = colorFilterParams(sliderValue);
    deck.colorNode.type = type;
    deck.colorNode.frequency.value = freq;
  }

  // ---- hot cues (stored per-track, so they persist across deck swaps) ------
  function hotcueAction(key, index) {
    const deck = decks[key];
    if (!deck.meta) return;
    const track = deck.meta.track;
    if (track.hotcues[index] == null) {
      track.hotcues[index] = deckElapsed(deck.meta, ctx.currentTime);
    } else {
      jumpDeckTo(key, track.hotcues[index]);
    }
    renderPadBank(key);
  }
  function clearHotcue(key, index) {
    const deck = decks[key];
    if (!deck.meta) return;
    deck.meta.track.hotcues[index] = null;
    renderPadBank(key);
  }

  // ---- loop: engage/switch/exit, mutating the live node when already
  // playing so it keeps rolling instead of a stop/restart click -------------
  function toggleLoopSize(key, beats) {
    const deck = decks[key];
    if (!deck.meta) return;
    const now = ctx.currentTime;
    const loop = deck.meta.loop;
    const duration = deck.meta.track.duration;
    const len = loopLength(beats, deck.meta.track.bpm);
    const sameSizeActive = loop.active && Math.abs(loop.len - len) < 1e-6;
    if (sameSizeActive) {
      const wrapped = deckElapsed(deck.meta, now);
      if (deck.src) deck.src.loop = false;
      deck.meta = Object.assign({}, deck.meta, {
        offset: wrapped, playStartedAt: deck.meta.playing ? now : null,
        loop: { active: false, start: 0, len: 0 },
      });
    } else if (loop.active) {
      // never let the loop window run past the end of the track
      const clampedLen = Math.min(len, Math.max(0.05, duration - loop.start));
      const newLoop = { active: true, start: loop.start, len: clampedLen };
      if (deck.src) { deck.src.loopEnd = newLoop.start + newLoop.len; deck.src.loop = true; }
      deck.meta = Object.assign({}, deck.meta, { loop: newLoop });
    } else {
      const startPos = deckElapsed(deck.meta, now);
      const clampedLen = Math.min(len, Math.max(0.05, duration - startPos));
      const newLoop = { active: true, start: startPos, len: clampedLen };
      if (deck.src) { deck.src.loop = true; deck.src.loopStart = newLoop.start; deck.src.loopEnd = newLoop.start + newLoop.len; }
      deck.meta = Object.assign({}, deck.meta, {
        offset: startPos, playStartedAt: deck.meta.playing ? now : null, loop: newLoop,
      });
    }
    renderPadBank(key);
  }

  // ---- pad FX: toggled wet sends, ramped briefly to avoid clicks -----------
  function toggleFx(key, name) {
    const deck = decks[key];
    if (!deck.meta || !deck.fxWet) return;
    const active = !deck.fx[name];
    deck.fx[name] = active;
    const g = deck.fxWet[name].gain;
    const now = ctx.currentTime;
    g.cancelScheduledValues(now);
    g.setValueAtTime(g.value, now);
    g.linearRampToValueAtTime(active ? 1 : 0, now + 0.03);
    renderPadBank(key);
  }

  // ---- sampler: 4 pads per deck. An empty pad, pressed WHILE that deck is
  // playing, grabs a short slice starting at the current playhead position
  // out of the track that's actually loaded there right now — no external
  // or pre-made sounds. The slice is just {track, offset, duration}, since
  // the track's audioBuffer is already decoded; playing it back later is a
  // fresh source node reading that same buffer, so the pad always stays
  // tied to the song it came from. Pressing a pad that already holds a
  // slice just plays it, immediately, without touching the deck.
  const SAMPLE_CLIP_SECONDS = 1.5;
  function samplerAction(key, index) {
    const deck = decks[key];
    if (!deck.meta) return;
    const slot = deck.samplerSlots[index];
    if (slot) {
      playSamplerSlot(slot);
      return;
    }
    if (!deck.meta.playing) return; // capturing only makes sense while it's actually playing
    const pos = deckElapsed(deck.meta, ctx.currentTime);
    const duration = Math.min(SAMPLE_CLIP_SECONDS, Math.max(0.05, deck.meta.track.duration - pos));
    deck.samplerSlots[index] = { track: deck.meta.track, offset: pos, duration };
    renderPadBank(key);
  }

  function clearSamplerSlot(key, index) {
    decks[key].samplerSlots[index] = null;
    renderPadBank(key);
  }

  function playSamplerSlot(slot) {
    if (!slot || !slot.track.audioBuffer) return;
    ensureAudio();
    if (ctx.state === 'suspended') ctx.resume();
    const src = ctx.createBufferSource();
    src.buffer = slot.track.audioBuffer;
    const g = ctx.createGain(); g.gain.value = 1;
    src.connect(g); g.connect(masterGain);
    src.start(ctx.currentTime, slot.offset, slot.duration);
    src.onended = () => { try { src.disconnect(); g.disconnect(); } catch (e) {} };
  }

  function setPadMode(key, mode) {
    decks[key].padMode = mode;
    const tabs = key === 'A' ? els.padTabsA : els.padTabsB;
    tabs.querySelectorAll('.ptab').forEach((t) => t.classList.toggle('active', t.dataset.mode === mode));
    renderPadBank(key);
  }

  const FX_LABELS = [['echo', 'إيكو'], ['filter', 'فلتر'], ['flanger', 'فلانجر'], ['reverb', 'ريفيرب']];
  function renderPadBank(key) {
    const deck = decks[key];
    const grid = key === 'A' ? els.padsA : els.padsB;
    const track = deck.meta ? deck.meta.track : null;
    let html = '';
    if (deck.padMode === 'hotcue') {
      for (let i = 0; i < 4; i++) {
        const set = track && track.hotcues[i] != null;
        html += '<button class="pad' + (set ? ' set' : '') + '" data-pad="' + i + '"' + (track ? '' : ' disabled') + '>' + (set ? 'C' + (i + 1) : (i + 1)) + '</button>';
      }
    } else if (deck.padMode === 'fx') {
      FX_LABELS.forEach(([id, label]) => {
        const on = deck.fx[id];
        html += '<button class="pad' + (on ? ' set' : '') + '" data-pad="' + id + '"' + (track ? '' : ' disabled') + '>' + label + '</button>';
      });
    } else if (deck.padMode === 'loop') {
      [1, 2, 4, 8].forEach((beats) => {
        const active = !!(track && deck.meta.loop.active && Math.abs(deck.meta.loop.len - loopLength(beats, track.bpm)) < 1e-6);
        html += '<button class="pad' + (active ? ' set' : '') + '" data-pad="' + beats + '"' + (track ? '' : ' disabled') + '>' + beats + '</button>';
      });
    } else if (deck.padMode === 'sampler') {
      for (let i = 0; i < 4; i++) {
        const slot = deck.samplerSlots[i];
        const capturable = !slot && !!(track && deck.meta.playing);
        const label = slot ? slot.track.name.slice(0, 5) : 'REC';
        html += '<button class="pad' + (slot ? ' set' : '') + '" data-pad="' + i + '"' + ((slot || capturable) ? '' : ' disabled') + '>' + label + '</button>';
      }
    }
    grid.innerHTML = html;
  }

  /* =========================================================================
     AUTO DJ ENGINE (V7) — off by default. Layered per the requested
     architecture:
       Track Analysis        -> analyzeTrack() (BPM/key/structure/phrases/
                                 vocal-curve/loudness, run once per upload)
       Library Intelligence  -> trackFeatureVector() (turns a track into
                                 the numbers everything else scores against)
       Session/Energy Manager-> the `autoDj.arc` warmup/build/peak/release
                                 state (energyJourney.js) + `autoDj.history`
       Track Selector        -> scoreCandidate/rerankByJourney in
                                 prepareNextTrack()
       Transition Planner    -> planTransition() (phrase-aligned trigger
                                 point, vocal-collision check, strategy
                                 choice, bass-handoff plan, loudness trim)
       Realtime Mix Executor -> beginTransition/stepTransition/
                                 completeTransition (drives the SAME manual
                                 functions used above — setEq, setTempo,
                                 applyCrossfader, loadTrackToDeck, start/
                                 stopDeckPlayback — never raw AudioParam
                                 automation, and never anything the UI
                                 layer decides on its own)
       Audio Engine          -> ensureAudio/buildDeckAudioChain etc. above
     TAKE CONTROL just stops autoDjTick from being called (see the main
     tick() loop) — nothing is torn down, reset, or even cleared, so
     whatever was mid-flight (including a mid-crossfade) is frozen exactly
     in place and resumes from that exact point, not from zero, if Auto DJ
     is turned back on.
     ========================================================================= */

  let LOOKAHEAD_SECONDS = 45;         // start planning the next track this far from the live track's end
  let TRANSITION_DURATION_SCALE = 1;  // test-only multiplier on every strategy's bar-derived duration
  const PHASE_CORRECTION_MIN_GAP = 3; // seconds between phase nudges
  const EQ_ID_SUFFIX = { low: 'Low', mid: 'Mid', high: 'Hi' };

  const STRATEGY_LABELS_AR = {
    LOOP_EXIT: 'خروج من اللووب', DROP_SWAP: 'تبديل عند الـDrop', ECHO_OUT: 'خروج بإيكو',
    HARD_CUT: 'قطع مباشر', LONG_BLEND: 'مزج طويل', BASS_SWAP: 'تبديل الباص',
    FILTER_MIX: 'مزج بالفلتر', SHORT_BLEND: 'مزج قصير', EQ_BLEND: 'مزج EQ عام',
    EMERGENCY_CUT: 'قفزة طارئة',
  };
  const REASON_LABELS_AR = {
    outgoing_loop_active: 'في لووب شغال حاليًا', both_drops_aligned: 'الأغنيتين عندهم Drop متوافق',
    no_clean_outro: 'ما في نهاية واضحة للأغنية الحالية', vocal_collision_unavoidable: 'تصادم غناء ما إلو حل بالوقت المتاح',
    bpm_close: 'BPM متقارب', key_compatible: 'المقام متوافق', clear_percussion: 'إيقاع واضح بالأغنيتين',
    both_bass_heavy: 'الأغنيتين فيهم باص قوي', bpm_workable: 'BPM قابل للتعديل', energy_rising: 'الطاقة عم ترتفع',
    moderate_compatibility: 'توافق متوسط', default_general_purpose: 'خيار عام بدون شي مميز',
    avoided_repeating_last_strategy: 'تجنب تكرار نفس أسلوب المزج السابق',
  };
  const ARC_LABELS_AR = { warmup: 'إحماء', build: 'صعود', peak: 'ذروة', release: 'تهدئة' };
  function strategyLabel(name) { return STRATEGY_LABELS_AR[name] || name; }
  function reasonLabel(key) { return REASON_LABELS_AR[key] || key; }
  function arcPhaseLabel(p) { return ARC_LABELS_AR[p] || p; }

  const autoDj = {
    on: false,
    liveKey: null, idleKey: null,
    phase: 'idle',        // idle | playing | prepared | transitioning
    nextTrack: null,      // { key, track, plan, breakdown, manual? }
    transition: null,     // { fromKey, toKey, startedAt, duration, fromX, toX, strategy, bassPlan, frozenProgress? }
    history: [],          // [{id, artist, bpm, camelot, energy, strategy}] oldest first
    statusText: '',
    lastPhaseCorrectionAt: 0,
    arc: initArcState(),         // session Energy Journey state
    lastStrategyUsed: null,      // for "don't repeat the same transition without reason"
    preview: null,                // NEXT MIX preview data, or null
    awaitingManualPick: false,    // true after CHANGE TRACK, until the person loads one
    manualPickBaselineTrack: null,
  };

  function setAutoDjStatus(text) {
    autoDj.statusText = text;
    renderAutoDjUI();
  }

  function renderAutoDjUI() {
    if (!els.autoDjBtn) return;
    els.autoDjBtn.textContent = autoDj.on ? 'TAKE CONTROL' : 'AUTO DJ ON';
    els.autoDjBtn.classList.toggle('on', autoDj.on);
    els.autoDjStatus.textContent = autoDj.statusText || '';
    els.autoDjStatus.style.display = autoDj.statusText ? 'block' : 'none';
    renderNextMixPreview();
  }

  function renderNextMixPreview() {
    if (!els.nextMixPanel) return;
    const p = autoDj.on ? autoDj.preview : null;
    if (!p) { els.nextMixPanel.style.display = 'none'; return; }
    els.nextMixPanel.style.display = 'flex';
    els.nextMixStrategy.textContent = p.strategyLabel;
    els.nextMixTracks.textContent = p.fromName + '  ←  ' + p.toName;
    els.nextMixMeta.textContent =
      'يبدأ خلال ~' + p.barsUntilTrigger + ' bars · مدة ' + p.durationBars + ' bars · BPM ' +
      p.fromBpm + '←' + p.toBpm + ' · مقام ' + p.fromKey + '←' + p.toKey;
    els.nextMixReason.textContent = 'السبب: ' + p.reasons.join('، ') + (p.manual ? ' (اختيار يدوي)' : '');
  }

  function reflectEqSlider(key, band) {
    const el = els['eq' + EQ_ID_SUFFIX[band] + key];
    if (el) el.value = decks[key].eq[band];
  }

  // ---- Library Intelligence: track -> feature-vector for scoring, using
  // whatever analysis has finished (gracefully degrades to neutral scores
  // if something's missing) ---------------------------------------------
  function trackFeatureVector(track, bpmOverride) {
    return {
      id: track.id,
      artist: track.artist,
      bpm: bpmOverride || track.bpm,
      camelot: track.key ? track.key.camelot : null,
      energy: track.structure ? track.structure.loudness.rms : null,
      spectral: track.structure ? track.structure.spectral : null,
    };
  }

  function historyEntryFor(track, strategyName) {
    return {
      id: track.id, artist: track.artist, bpm: track.bpm,
      camelot: track.key ? track.key.camelot : null,
      energy: track.structure ? track.structure.loudness.rms : null,
      strategy: strategyName,
    };
  }

  function bootstrapAutoDj() {
    const ready = state.tracks.filter((t) => t.status === 'ready');
    if (!ready.length) {
      setAutoDjStatus('ما في أغاني جاهزة للتشغيل بعد — ارفع أغاني الأول.');
      return false;
    }
    const first = ready[0];
    loadTrackToDeck(first, autoDj.liveKey);
    startDeckPlayback(autoDj.liveKey);
    autoDj.history.push(historyEntryFor(first, null));
    setAutoDjStatus('بدأ الأوتو دي جي بتشغيل "' + first.name + '" على ديك ' + autoDj.liveKey + ' — مرحلة الجلسة: ' + arcPhaseLabel(autoDj.arc.phase) + '.');
    return true;
  }

  function setAutoDjOn(turnOn) {
    if (turnOn) {
      ensureAudio();
      if (ctx.state === 'suspended') ctx.resume();
      autoDj.on = true;
      if (autoDj.transition) {
        // resume a paused mid-crossfade exactly where TAKE CONTROL froze
        // it — never restart it, never snap it to a default.
        const t = autoDj.transition;
        t.startedAt = ctx.currentTime - (t.frozenProgress || 0) * t.duration;
        setAutoDjStatus('تابع الأوتو دي جي المزج المعلّق من نفس النقطة (~' + Math.round((t.frozenProgress || 0) * 100) + '%).');
        renderAutoDjUI();
        return;
      }
      const aHas = !!decks.A.meta, bHas = !!decks.B.meta;
      const aPlaying = aHas && decks.A.meta.playing;
      const bPlaying = bHas && decks.B.meta.playing;
      let resumeKey = null;
      if (aPlaying && !bPlaying) { autoDj.liveKey = 'A'; autoDj.idleKey = 'B'; }
      else if (bPlaying && !aPlaying) { autoDj.liveKey = 'B'; autoDj.idleKey = 'A'; }
      else if (aPlaying && bPlaying) {
        autoDj.liveKey = decks.A.gain.gain.value >= decks.B.gain.gain.value ? 'A' : 'B';
        autoDj.idleKey = autoDj.liveKey === 'A' ? 'B' : 'A';
      } else if (aHas || bHas) {
        // nothing is actually playing, but a deck is cued — resume THAT
        // deck exactly where it was, never start from zero.
        autoDj.liveKey = aHas ? 'A' : 'B';
        autoDj.idleKey = autoDj.liveKey === 'A' ? 'B' : 'A';
        resumeKey = autoDj.liveKey;
      } else {
        autoDj.liveKey = 'A'; autoDj.idleKey = 'B';
      }
      if (autoDj.phase !== 'prepared' || !autoDj.nextTrack) { autoDj.phase = 'playing'; autoDj.nextTrack = null; autoDj.preview = null; }
      renderAutoDjUI();
      if (resumeKey) {
        startDeckPlayback(resumeKey);
        setAutoDjStatus('تابع الأوتو دي جي من نفس المكان — ديك ' + resumeKey + ' كمل التشغيل من ' + humanTime(decks[resumeKey].meta.offset) + '.');
      } else if (!aHas && !bHas) {
        const ok = bootstrapAutoDj();
        if (!ok) { autoDj.on = false; renderAutoDjUI(); return; }
      } else {
        setAutoDjStatus('تولى الأوتو دي جي المزج من وضع النظام الحالي — ديك ' + autoDj.liveKey + ' هو المباشر، وكل الفيدرز/الإي كيو/اللووبات زي ما هي.');
      }
    } else {
      // TAKE CONTROL: stop issuing new AI commands immediately. Do not stop
      // playback, do not reset faders/EQ/loops — freeze everything exactly
      // where it is. If a crossfade was mid-flight, remember its exact
      // progress so re-enabling can pick the same fade back up rather than
      // restarting or snapping it to an end state.
      if (autoDj.transition && ctx) {
        const t = autoDj.transition;
        t.frozenProgress = Math.min(1, (ctx.currentTime - t.startedAt) / t.duration);
      }
      autoDj.on = false;
      setAutoDjStatus('التحكم يدوي بالكامل الآن — كل عناصر التحكم (الفيدرز، الـEQ، أي مزج شغال) بقيت مجمّدة بمكانها بالضبط.');
    }
    renderAutoDjUI();
  }

  // ---- Transition Planner: decides WHEN (a phrase-aligned trigger point,
  // steered away from stacking two vocal-heavy sections when a nearby
  // alternative exists), WHICH strategy, and HOW (bass-handoff shape,
  // loudness trim) to mix into the next track. --------------------------
  function planTransition(fromKey, toKey, toTrack, breakdown, liveEnergyNorm, incomingEnergyNorm) {
    const liveDeck = decks[fromKey];
    const liveTrack = liveDeck.meta.track;
    const nowElapsed = deckElapsed(liveDeck.meta, ctx.currentTime);
    const loopActive = !!(liveDeck.meta.loop && liveDeck.meta.loop.active);
    const windowGuess = 8;

    let trigger, incomingOffset, vocalCollision;
    if (loopActive) {
      const loop = liveDeck.meta.loop;
      const cyclesAhead = Math.max(1, Math.ceil((nowElapsed - loop.start) / loop.len));
      trigger = loop.start + cyclesAhead * loop.len;
      incomingOffset = computeAlignedStartTime(trigger, liveTrack, toTrack);
      const outRange = { start: trigger, end: Math.min(liveTrack.duration, trigger + windowGuess) };
      const inRange = { start: incomingOffset, end: incomingOffset + windowGuess };
      vocalCollision = vocalCollisionRisk(liveTrack.vocalCurve, outRange, toTrack.vocalCurve, inRange).risk;
    } else {
      // Try the 16-bar grid first, but fall back to 8-bar (then the
      // near-end heuristic) based on whether a candidate actually falls
      // within the SEARCH WINDOW (now..duration) — not just on whether
      // the track has any 16-bar boundaries at all. A slow track can have
      // real 16-bar boundaries that are simply too far apart to have one
      // land in the time remaining once we're this close to the end, and
      // silently keeping the (empty) 16-bar pool in that case would force
      // an off-phrase trigger when a perfectly good 8-bar boundary exists.
      const inWindow = (t) => t > nowElapsed + 1 && t < liveTrack.duration - 1;
      const pool16 = liveTrack.phrases.phrases16.filter(inWindow);
      const pool8 = liveTrack.phrases.phrases8.filter(inWindow);
      const phrasePool = pool16.length ? pool16 : pool8;
      const candidates = phrasePool.length ? phrasePool.slice(0, 4) : [Math.max(nowElapsed + 1, liveTrack.duration - 6)];
      trigger = candidates[0]; incomingOffset = computeAlignedStartTime(trigger, liveTrack, toTrack); vocalCollision = true;
      for (const cand of candidates) {
        const off = computeAlignedStartTime(cand, liveTrack, toTrack);
        const outRange = { start: cand, end: Math.min(liveTrack.duration, cand + windowGuess) };
        const inRange = { start: off, end: off + windowGuess };
        const risk = vocalCollisionRisk(liveTrack.vocalCurve, outRange, toTrack.vocalCurve, inRange).risk;
        trigger = cand; incomingOffset = off; vocalCollision = risk;
        if (!risk) break; // found an instrumental-enough window — stop searching
      }
    }

    const sections = liveTrack.structure.sections;
    const lastSection = sections[sections.length - 1];
    const outgoingHasGoodOutro = !!lastSection && lastSection.label.indexOf('outro') === 0;
    const nearSection = sections.find((s) => trigger >= s.start && trigger < s.end);
    const outgoingNearDrop = !!nearSection && nearSection.label === 'drop';
    const incomingHasEarlyDrop = toTrack.structure.sections.slice(0, 2).some((s) => s.label === 'drop' || s.label === 'intro-hot');

    const { rate } = computeSyncRate(liveDeck.meta.effectiveBpm, toTrack.bpm);
    const strategyCtx = {
      bpmCompat: breakdown.bpm, keyCompat: breakdown.key,
      outgoingBass: liveTrack.structure.spectral.low, incomingBass: toTrack.structure.spectral.low,
      outgoingDensity: liveTrack.density, incomingDensity: toTrack.density,
      outgoingEnergy: liveEnergyNorm, incomingEnergy: incomingEnergyNorm,
      vocalCollision, outgoingHasGoodOutro, incomingHasEarlyDrop, outgoingNearDrop,
      outgoingLoopActive: loopActive,
    };
    const strategy = chooseTransitionStrategy(strategyCtx, autoDj.lastStrategyUsed);
    const bassPlan = planBassSwap(strategyCtx.outgoingBass, strategyCtx.incomingBass);
    const gainTrim = planGainTrim(liveTrack.loudnessDb, toTrack.loudnessDb);
    const beatLen = 60 / liveTrack.bpm;
    const idealDuration = Math.max(0.5, strategy.durationBars * 4 * beatLen) * TRANSITION_DURATION_SCALE;
    // Safety clamp: never plan a blend that would outlast the outgoing
    // track's OWN remaining audio — a 32-bar LONG_BLEND chosen with only
    // a few seconds of runway left (a short track, or a trigger forced
    // close to the end by the phrase/vocal search) would otherwise have
    // the outgoing source stop mid-fade instead of completing the blend.
    // Shortening it is an honest degradation; overrunning is a real
    // audio defect.
    const runway = Math.max(1, liveTrack.duration - trigger - 0.5);
    const durationSeconds = Math.min(idealDuration, runway);
    const clampedForTrackLength = durationSeconds < idealDuration - 1e-6;

    return { trigger, incomingOffset, rate, strategy, bassPlan, gainTrim, durationSeconds, idealDuration, clampedForTrackLength, strategyCtx, vocalCollision };
  }

  function buildPreview(plan, toTrack, manual) {
    const liveDeck = decks[autoDj.liveKey];
    const liveTrack = liveDeck.meta.track;
    const beatLen = 60 / liveTrack.bpm;
    const barsUntilTrigger = Math.max(0, Math.round((plan.trigger - deckElapsed(liveDeck.meta, ctx.currentTime)) / (beatLen * 4)));
    return {
      fromName: liveTrack.name, toName: toTrack.name, barsUntilTrigger,
      strategyName: plan.strategy.name, strategyLabel: strategyLabel(plan.strategy.name),
      durationBars: plan.strategy.durationBars,
      fromKey: liveTrack.key ? liveTrack.key.name : '؟', toKey: toTrack.key ? toTrack.key.name : '؟',
      fromBpm: Math.round(liveDeck.meta.effectiveBpm), toBpm: Math.round(toTrack.bpm),
      reasons: plan.strategy.reasons.map(reasonLabel), manual: !!manual,
    };
  }

  // ---- Track Selector + Session/Energy Manager: score every other ready
  // track against the live one, then re-rank by how well it fits the
  // CURRENT arc phase — so the set has a shape instead of only ever
  // grabbing the single closest-matching track. -------------------------
  function prepareNextTrack(excludeIds) {
    excludeIds = excludeIds || [];
    const live = decks[autoDj.liveKey];
    const liveTrack = live.meta.track;
    const readyOthers = state.tracks.filter((t) => t.status === 'ready' && t !== liveTrack && excludeIds.indexOf(t.id) === -1);
    if (!readyOthers.length) {
      autoDj.phase = 'playing';
      setAutoDjStatus('ما في أغنية ثانية مناسبة بالمكتبة الآن — رح تكمل "' + liveTrack.name + '" لحالها.');
      return;
    }
    const allReady = state.tracks.filter((t) => t.status === 'ready');
    const libEnergies = allReady.map((t) => t.structure.loudness.rms);
    const libMin = Math.min.apply(null, libEnergies), libMax = Math.max.apply(null, libEnergies);
    const currentFeatures = trackFeatureVector(liveTrack, live.meta.effectiveBpm);
    const liveEnergyNorm = normalizeEnergy(currentFeatures.energy, libMin, libMax);

    const scored = readyOthers.map((t) => {
      const feat = trackFeatureVector(t);
      const { score, breakdown } = scoreCandidate(currentFeatures, feat, autoDj.history);
      return { track: t, score, breakdown, energyNorm: normalizeEnergy(feat.energy, libMin, libMax) };
    });
    const picked = rerankByJourney(scored, autoDj.arc.phase, 0.3);
    const nextTrack = picked.track;

    loadTrackToDeck(nextTrack, autoDj.idleKey);
    const plan = planTransition(autoDj.liveKey, autoDj.idleKey, nextTrack, picked.breakdown, liveEnergyNorm, picked.energyNorm);
    autoDj.nextTrack = { key: autoDj.idleKey, track: nextTrack, plan, breakdown: picked.breakdown };
    autoDj.phase = 'prepared';
    autoDj.preview = buildPreview(plan, nextTrack, false);
    setAutoDjStatus(
      'جهّز الأوتو دي جي "' + nextTrack.name + '" على ديك ' + autoDj.idleKey + ' — إستراتيجية: ' +
      strategyLabel(plan.strategy.name) + ' (' + plan.strategy.reasons.map(reasonLabel).join('، ') + ').'
    );
    renderNextMixPreview();
  }

  // ---- NEXT MIX preview controls: EXECUTE / SKIP / CHANGE TRACK. Auto DJ
  // still auto-executes on schedule if the person does nothing — these
  // just stay available to override it. ----------------------------------
  function executePreviewNow() {
    if (!autoDj.nextTrack || !autoDj.on) return;
    beginTransition(ctx.currentTime, autoDj.nextTrack.plan);
  }
  function skipPreviewPick() {
    if (!autoDj.nextTrack || !autoDj.on) return;
    const rejectedId = autoDj.nextTrack.track.id;
    autoDj.nextTrack = null; autoDj.preview = null; autoDj.phase = 'playing';
    prepareNextTrack([rejectedId]);
  }
  function requestChangeTrack() {
    if (!autoDj.nextTrack || !autoDj.on) return;
    autoDj.awaitingManualPick = true;
    autoDj.manualPickBaselineTrack = decks[autoDj.idleKey].meta ? decks[autoDj.idleKey].meta.track : null;
    autoDj.nextTrack = null; autoDj.preview = null; autoDj.phase = 'playing';
    setAutoDjStatus('اختر إنت أغنية من المكتبة وحمّلها على ديك ' + autoDj.idleKey + ' — الأوتو دي جي بيكمل المزج منها.');
    renderNextMixPreview();
  }
  function commitManualPick() {
    const idleKey = autoDj.idleKey;
    const track = decks[idleKey].meta.track;
    const live = decks[autoDj.liveKey];
    const allReady = state.tracks.filter((t) => t.status === 'ready');
    const libEnergies = allReady.map((t) => t.structure.loudness.rms);
    const libMin = Math.min.apply(null, libEnergies), libMax = Math.max.apply(null, libEnergies);
    const currentFeatures = trackFeatureVector(live.meta.track, live.meta.effectiveBpm);
    const liveEnergyNorm = normalizeEnergy(currentFeatures.energy, libMin, libMax);
    const feat = trackFeatureVector(track);
    const { score, breakdown } = scoreCandidate(currentFeatures, feat, autoDj.history);
    const incomingEnergyNorm = normalizeEnergy(feat.energy, libMin, libMax);
    const plan = planTransition(autoDj.liveKey, idleKey, track, breakdown, liveEnergyNorm, incomingEnergyNorm);
    autoDj.nextTrack = { key: idleKey, track, plan, breakdown, manual: true };
    autoDj.phase = 'prepared';
    autoDj.awaitingManualPick = false;
    autoDj.preview = buildPreview(plan, track, true);
    setAutoDjStatus('اخترت "' + track.name + '" يدويًا — الأوتو دي جي بيكمل المزج منها (إستراتيجية: ' + strategyLabel(plan.strategy.name) + ').');
    renderNextMixPreview();
  }

  // ---- Realtime Mix Executor: drives the SAME manual functions as the
  // person's own controls — never raw AudioParam automation the UI can't
  // see or override. ------------------------------------------------------
  function beginTransition(now, plan) {
    const fromKey = autoDj.liveKey, toKey = autoDj.nextTrack.key;
    const toTrack = autoDj.nextTrack.track;
    const incoming = decks[toKey];
    incoming.meta = Object.assign({}, incoming.meta, {
      offset: plan.incomingOffset, rate: plan.rate, effectiveBpm: toTrack.bpm * plan.rate, playing: false, playStartedAt: null,
    });
    setEq(toKey, 'low', -1);
    reflectEqSlider(toKey, 'low');
    startDeckPlayback(toKey);
    const tempoSlider = toKey === 'A' ? els.tempoA : els.tempoB;
    tempoSlider.value = rateToTempoPercent(plan.rate);

    // loudness match: a small, capped, partial auto-trim on the incoming
    // deck's OWN gain stage (never the crossfader) — see loudnessMatch.js.
    if (incoming.trimGain) {
      incoming.trimGain.gain.cancelScheduledValues(now);
      incoming.trimGain.gain.setValueAtTime(1, now);
      incoming.trimGain.gain.linearRampToValueAtTime(dbToGain(plan.gainTrim.trimDb), now + 0.4);
    }
    if (plan.strategy.name === 'ECHO_OUT' && !decks[fromKey].fx.echo) toggleFx(fromKey, 'echo');

    const fromX = parseFloat(els.crossfader.value);
    const toX = fromKey === 'A' ? 100 : 0;
    autoDj.transition = { fromKey, toKey, startedAt: now, duration: plan.durationSeconds, fromX, toX, strategy: plan.strategy, bassPlan: plan.bassPlan };
    autoDj.phase = 'transitioning';
    autoDj.lastStrategyUsed = plan.strategy.name;
    autoDj.preview = null;
    setAutoDjStatus('عم يمزج الأوتو دي جي من ديك ' + fromKey + ' لديك ' + toKey + ' ("' + toTrack.name + '") — إستراتيجية: ' + strategyLabel(plan.strategy.name) + '.');
    renderNextMixPreview();
  }

  function maybeCorrectPhase(now) {
    const t = autoDj.transition;
    if (!t) return;
    const a = decks[t.fromKey], b = decks[t.toKey];
    if (!a.meta || !b.meta || !a.meta.playing || !b.meta.playing) return;
    if (now - autoDj.lastPhaseCorrectionAt < PHASE_CORRECTION_MIN_GAP) return;
    const elapsedA = deckElapsed(a.meta, now), elapsedB = deckElapsed(b.meta, now);
    const err = phaseErrorBeats(elapsedA, a.meta.track, elapsedB, b.meta.track);
    if (Math.abs(err) < 0.06) return;
    autoDj.lastPhaseCorrectionAt = now;
    // small, brief tempo nudge to pull the incoming deck's phase back in
    // line — not continuous audio-domain beat tracking, just a periodic
    // correction against the two decks' own detected beat grids.
    const baseRate = b.meta.rate;
    const nudged = baseRate * (1 + (err > 0 ? -0.02 : 0.02));
    const srcAtNudge = b.src;
    if (srcAtNudge) srcAtNudge.playbackRate.value = nudged;
    setTimeout(() => {
      if (decks[t.toKey].src === srcAtNudge && srcAtNudge) srcAtNudge.playbackRate.value = baseRate;
    }, 900);
  }

  function completeTransition() {
    const t = autoDj.transition;
    const oldKey = t.fromKey, newKey = t.toKey;
    if (decks[oldKey].fx.echo) toggleFx(oldKey, 'echo');
    if (decks[oldKey].meta && decks[oldKey].meta.playing) stopDeckPlayback(oldKey);
    renderPadBank(oldKey);
    const newTrack = decks[newKey].meta.track;
    autoDj.history.push(historyEntryFor(newTrack, t.strategy.name));
    autoDj.arc = advanceArc(autoDj.arc);
    autoDj.liveKey = newKey; autoDj.idleKey = oldKey;
    autoDj.transition = null;
    autoDj.nextTrack = null;
    autoDj.phase = 'playing';
    setAutoDjStatus('ديك ' + newKey + ' هو المباشر الآن ("' + newTrack.name + '") — مرحلة الجلسة: ' + arcPhaseLabel(autoDj.arc.phase) + '.');
  }

  function stepTransition(now) {
    const t = autoDj.transition;
    const rawP = Math.min(1, (now - t.startedAt) / t.duration);
    const p = applyCurve(t.strategy.curve, rawP); // human-timing shape; start/end stay exact (beat-accurate)
    const x = t.fromX + (t.toX - t.fromX) * p;
    els.crossfader.value = String(x);
    applyCrossfader();
    setEq(t.fromKey, 'low', outgoingBassCurve(p, t.bassPlan));
    setEq(t.toKey, 'low', incomingBassCurve(p, t.bassPlan));
    reflectEqSlider(t.fromKey, 'low');
    reflectEqSlider(t.toKey, 'low');
    maybeCorrectPhase(now);
    if (rawP >= 1) completeTransition();
  }

  // Safety net: the live deck already stopped (natural end reached, or
  // anything else) before a smooth crossfade got a chance to run. Rather
  // than sit in silence, jump straight to whatever's prepared.
  function emergencySwitch() {
    const toKey = autoDj.nextTrack.key, fromKey = autoDj.liveKey;
    const toTrack = autoDj.nextTrack.track;
    decks[toKey].meta = Object.assign({}, decks[toKey].meta, { offset: 0, playing: false, playStartedAt: null });
    startDeckPlayback(toKey);
    els.crossfader.value = toKey === 'B' ? '100' : '0';
    applyCrossfader();
    setEq(toKey, 'low', 0); reflectEqSlider(toKey, 'low');
    setEq(fromKey, 'low', 0); reflectEqSlider(fromKey, 'low');
    if (decks[fromKey].fx.echo) toggleFx(fromKey, 'echo');
    autoDj.history.push(historyEntryFor(toTrack, 'EMERGENCY_CUT'));
    autoDj.arc = advanceArc(autoDj.arc);
    autoDj.liveKey = toKey; autoDj.idleKey = fromKey;
    autoDj.nextTrack = null; autoDj.transition = null; autoDj.phase = 'playing'; autoDj.preview = null;
    setAutoDjStatus('خلصت الأغنية قبل ما يكمل المزج التدريجي — قفز الأوتو دي جي مباشرة لـ"' + toTrack.name + '".');
  }

  // Called once per animation frame from the main tick() loop, but only
  // does anything while Auto DJ is on.
  function autoDjTick(now) {
    if (!autoDj.on) return;
    if (autoDj.awaitingManualPick) {
      const idleMeta = decks[autoDj.idleKey].meta;
      if (idleMeta && idleMeta.track !== autoDj.manualPickBaselineTrack) commitManualPick();
      return;
    }
    const live = decks[autoDj.liveKey];
    if (!live.meta) return;
    if (autoDj.transition) { stepTransition(now); return; }
    if (!live.meta.playing) {
      // the live deck stopped without us catching it during a lookahead
      // window — recover instead of sitting in silence.
      if (autoDj.nextTrack) { emergencySwitch(); return; }
      if (autoDj.phase !== 'idle') {
        prepareNextTrack();
        if (autoDj.nextTrack) emergencySwitch();
      }
      return;
    }
    const elapsed = deckElapsed(live.meta, ctx.currentTime);
    const remaining = live.meta.track.duration - elapsed;
    if (autoDj.phase === 'playing' && remaining <= LOOKAHEAD_SECONDS) {
      prepareNextTrack();
    } else if (autoDj.phase === 'prepared') {
      // phrase-anchored, not a flat countdown: fire right at the planned
      // trigger point (or as a last resort, before the track actually ends)
      if (elapsed >= autoDj.nextTrack.plan.trigger || remaining <= 1) beginTransition(now, autoDj.nextTrack.plan);
    }
  }

  // ---- library UI -----------------------------------------------------------
  function starsMarkup(track) {
    let html = '<span class="pstars" data-id="' + track.id + '">';
    for (let i = 1; i <= 5; i++) {
      html += '<svg class="pstar' + (track.rating >= i ? ' on' : '') + '" data-star="' + i + '" viewBox="0 0 20 20" fill="currentColor"><path d="M10 1.5l2.6 5.4 5.9.7-4.3 4.1 1 5.9L10 14.8l-5.2 2.8 1-5.9-4.3-4.1 5.9-.7z"/></svg>';
    }
    return html + '</span>';
  }

  function renderLibrary() {
    els.trackCount.textContent = state.tracks.length + (state.tracks.length === 1 ? ' أغنية' : ' أغاني');
    els.plist.innerHTML = '';
    state.tracks.forEach((t) => {
      const row = document.createElement('div');
      const onA = decks.A.meta && decks.A.meta.track === t;
      const onB = decks.B.meta && decks.B.meta.track === t;
      row.className = 'prow' + (onA ? ' on-a' : onB ? ' on-b' : '');
      row.dataset.id = t.id;

      const pill = document.createElement('div'); pill.className = 'loadpill';
      const btnA = document.createElement('button'); btnA.className = 'loadbtn a' + (onA ? ' active' : ''); btnA.type = 'button'; btnA.textContent = 'A'; btnA.dataset.deck = 'A';
      const btnB = document.createElement('button'); btnB.className = 'loadbtn b' + (onB ? ' active' : ''); btnB.type = 'button'; btnB.textContent = 'B'; btnB.dataset.deck = 'B';
      if (t.status !== 'ready') { btnA.disabled = true; btnB.disabled = true; }
      pill.appendChild(btnA); pill.appendChild(btnB);
      row.appendChild(pill);

      const name = document.createElement('div'); name.className = 'pname'; name.textContent = t.name;
      row.appendChild(name);

      if (t.status === 'analyzing') {
        const spin = document.createElement('div'); spin.className = 'pspin'; row.appendChild(spin);
      } else if (t.status === 'ready') {
        const starsWrap = document.createElement('div'); starsWrap.innerHTML = starsMarkup(t);
        row.appendChild(starsWrap.firstChild);
        const bpm = document.createElement('div'); bpm.className = 'pbpm'; bpm.textContent = Math.round(t.bpm);
        row.appendChild(bpm);
      }

      const time = document.createElement('div'); time.className = 'ptime';
      if ((onA || onB) && ctx) {
        const meta = decks[onA ? 'A' : 'B'].meta;
        const remaining = meta.track.duration - deckElapsed(meta, ctx.currentTime);
        time.textContent = humanTimeSigned(-remaining);
      } else {
        time.textContent = t.status === 'ready' ? humanTime(t.duration) : '--:--';
      }
      row.appendChild(time);

      const del = document.createElement('button'); del.className = 'pdel'; del.type = 'button';
      del.innerHTML = '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
      if (isInUse(t)) del.disabled = true;
      del.setAttribute('aria-label', 'حذف');
      row.appendChild(del);

      els.plist.appendChild(row);
    });
  }

  // called every animation frame: only touches the countdown text of the
  // one or two "live" rows, so it never rebuilds the list (which would
  // fight with the user's own clicks on load/star/delete buttons).
  function updateLiveTimes() {
    if (!ctx) return;
    els.plist.querySelectorAll('.prow.on-a, .prow.on-b').forEach((row) => {
      const isA = row.classList.contains('on-a');
      const meta = decks[isA ? 'A' : 'B'].meta;
      const timeEl = row.querySelector('.ptime');
      if (!meta || !timeEl) return;
      const remaining = meta.track.duration - deckElapsed(meta, ctx.currentTime);
      timeEl.textContent = humanTimeSigned(-remaining);
    });
  }

  els.plist.addEventListener('click', (e) => {
    const row = e.target.closest('.prow');
    if (!row) return;
    const track = state.tracks.find((t) => t.id === parseInt(row.dataset.id, 10));
    if (!track) return;

    const loadBtn = e.target.closest('.loadbtn');
    if (loadBtn && !loadBtn.disabled) { loadTrackToDeck(track, loadBtn.dataset.deck); return; }

    const star = e.target.closest('.pstar');
    if (star) { setRating(track, parseInt(star.dataset.star, 10)); return; }

    const del = e.target.closest('.pdel');
    if (del && !del.disabled) { deleteTrack(track); return; }
  });

  // ---- waveform + jog wheel drawing -----------------------------------------
  function drawWave(key, track, progress) {
    const canvas = key === 'A' ? els.waveA : els.waveB;
    const c = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;
    c.clearRect(0, 0, w, h);
    if (!track || !track.peaksWide) return;
    const color = key === 'A' ? '#35d7c4' : '#ef4a56';
    const peaks = track.peaksWide;
    const barW = w / peaks.length;
    const playedN = Math.floor(progress * peaks.length);
    for (let i = 0; i < peaks.length; i++) {
      const bh = Math.max(2, peaks[i] * h * 0.92);
      c.fillStyle = i <= playedN ? color : 'rgba(255,255,255,.16)';
      c.fillRect(i * barW, (h - bh) / 2, Math.max(1, barW - 1), bh);
    }
    if (progress > 0 && progress < 1) {
      c.fillStyle = '#fff';
      c.fillRect(progress * w, 0, 1.5, h);
    }
  }

  const wheelArtCache = new WeakMap();
  function getWheelArt(key, track) {
    if (!track) return null;
    if (wheelArtCache.has(track) && wheelArtCache.get(track).key === key) return wheelArtCache.get(track).canvas;
    const off = document.createElement('canvas');
    off.width = 220; off.height = 220;
    const c = off.getContext('2d');
    const cx = 110, cy = 110;
    const color = key === 'A' ? '#35d7c4' : '#ef4a56';
    c.fillStyle = '#101116';
    c.beginPath(); c.arc(cx, cy, 108, 0, Math.PI * 2); c.fill();
    let seed = 0;
    for (let i = 0; i < track.name.length; i++) seed = (seed * 31 + track.name.charCodeAt(i)) >>> 0;
    const rand = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
    for (let i = 0; i < 5; i++) {
      const ang = rand() * Math.PI * 2;
      const dist = rand() * 60;
      const bx = cx + Math.cos(ang) * dist, by = cy + Math.sin(ang) * dist;
      const r = 30 + rand() * 46;
      const grad = c.createRadialGradient(bx, by, 0, bx, by, r);
      grad.addColorStop(0, color + 'aa');
      grad.addColorStop(1, color + '00');
      c.fillStyle = grad;
      c.beginPath(); c.arc(bx, by, r, 0, Math.PI * 2); c.fill();
    }
    c.strokeStyle = 'rgba(255,255,255,.07)';
    c.lineWidth = 1;
    for (let r = 20; r < 108; r += 7) { c.beginPath(); c.arc(cx, cy, r, 0, Math.PI * 2); c.stroke(); }
    c.fillStyle = color;
    c.beginPath(); c.arc(cx, cy, 30, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#0b0c10';
    c.beginPath(); c.arc(cx, cy, 5, 0, Math.PI * 2); c.fill();
    c.strokeStyle = 'rgba(255,255,255,.12)';
    c.lineWidth = 2;
    c.beginPath(); c.arc(cx, cy, 107, 0, Math.PI * 2); c.stroke();
    wheelArtCache.set(track, { key, canvas: off });
    return off;
  }

  function drawWheel(key, track) {
    const canvas = key === 'A' ? els.wheelA : els.wheelB;
    const c = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;
    c.clearRect(0, 0, w, h);
    if (!track) {
      c.fillStyle = '#101116';
      c.beginPath(); c.arc(w / 2, h / 2, 108, 0, Math.PI * 2); c.fill();
      c.strokeStyle = 'rgba(255,255,255,.08)'; c.lineWidth = 1;
      for (let r = 20; r < 108; r += 7) { c.beginPath(); c.arc(w / 2, h / 2, r, 0, Math.PI * 2); c.stroke(); }
      return;
    }
    const art = getWheelArt(key, track);
    c.save();
    c.translate(w / 2, h / 2);
    c.rotate(state.wheelAngle[key]);
    c.drawImage(art, -w / 2, -h / 2, w, h);
    c.restore();
  }

  function renderDeckFace(key) {
    const meta = decks[key].meta;
    const titleEl = key === 'A' ? els.titleA : els.titleB;
    const bpmEl = key === 'A' ? els.bpmA : els.bpmB;
    if (!meta) {
      titleEl.textContent = 'فاضي';
      bpmEl.textContent = '-- BPM';
      drawWave(key, null, 0);
      drawWheel(key, null);
      return;
    }
    titleEl.textContent = meta.track.name;
    bpmEl.textContent = Math.round(meta.effectiveBpm) + ' BPM';
    const progress = ctx ? Math.min(1, Math.max(0, deckElapsed(meta, ctx.currentTime) / meta.track.duration)) : 0;
    drawWave(key, meta.track, progress);
    drawWheel(key, meta.track);
  }

  // ---- on-air + deck buttons -------------------------------------------------
  function updateOnAir() {
    if (!ctx) return;
    els.onairA.classList.toggle('live', decks.A.meta && decks.A.meta.playing && decks.A.gain.gain.value > 0.03);
    els.onairB.classList.toggle('live', decks.B.meta && decks.B.meta.playing && decks.B.gain.gain.value > 0.03);
  }

  function playIconHtml(isOn) {
    return isOn
      ? '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>إيقاف'
      : '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>تشغيل';
  }

  function updateDeckButtons() {
    ['A', 'B'].forEach((key) => {
      const meta = decks[key].meta;
      const otherMeta = decks[key === 'A' ? 'B' : 'A'].meta;
      const playBtn = key === 'A' ? els.playA : els.playB;
      const cueBtn = key === 'A' ? els.cueA : els.cueB;
      const syncBtn = key === 'A' ? els.syncA : els.syncB;
      playBtn.disabled = !meta;
      cueBtn.disabled = !meta;
      syncBtn.disabled = !meta || !otherMeta;
      const isOn = !!(meta && meta.playing);
      playBtn.innerHTML = playIconHtml(isOn);
      playBtn.classList.toggle('is-on', isOn);
    });
  }

  // ---- beat flash strip: visual aid only, each half shows that deck's own
  // beat so the person can eyeball whether the two are in time -------------
  const BEAT_TICKS = 16;
  (function buildBeatStrip() {
    for (let i = 0; i < BEAT_TICKS; i++) {
      const t = document.createElement('div');
      t.className = 'beat-tick';
      t.dataset.side = i < BEAT_TICKS / 2 ? 'a' : 'b';
      els.beatStrip.appendChild(t);
    }
  })();
  const beatTicksA = Array.from(els.beatStrip.querySelectorAll('[data-side="a"]'));
  const beatTicksB = Array.from(els.beatStrip.querySelectorAll('[data-side="b"]'));

  function flashFor(key) {
    const meta = decks[key].meta;
    if (!ctx || !meta || !meta.playing) return 0;
    // deckElapsed() and track.firstBeat are both in buffer-time (original
    // track) coordinates, unaffected by playbackRate — so the beat interval
    // used here must be the track's own (60/bpm), not the rate-scaled
    // effectiveBpm, or the flash drifts out of phase after a SYNC.
    const beatInterval = 60 / meta.track.bpm;
    const pos = deckElapsed(meta, ctx.currentTime);
    const phase = (((pos - meta.track.firstBeat) / beatInterval) % 1 + 1) % 1;
    return Math.max(0, 1 - phase * 5);
  }

  function updateBeatStrip() {
    const fa = flashFor('A'), fb = flashFor('B');
    beatTicksA.forEach((el) => {
      el.style.background = 'rgba(53,215,196,' + (0.18 + fa * 0.7) + ')';
      el.style.height = (8 + fa * 9) + 'px';
    });
    beatTicksB.forEach((el) => {
      el.style.background = 'rgba(239,74,86,' + (0.18 + fb * 0.7) + ')';
      el.style.height = (8 + fb * 9) + 'px';
    });
  }

  // ---- main render loop -----------------------------------------------------
  function tick() {
    ['A', 'B'].forEach((key) => {
      const deck = decks[key];
      if (deck.meta && deck.meta.playing) {
        // stop cleanly at natural end instead of letting the buffer just go silent
        if (deckElapsed(deck.meta, ctx.currentTime) >= deck.meta.track.duration) {
          if (deck.src) { try { deck.src.stop(); } catch (e) {} }
          deck.meta = Object.assign({}, deck.meta, { offset: deck.meta.track.duration, playing: false, playStartedAt: null });
          // sampler capture affordance depends on "is this deck playing", so
          // refresh it here — this only fires once, right at track end, not
          // every frame.
          if (deck.padMode === 'sampler') renderPadBank(key);
        } else {
          state.wheelAngle[key] += (1 / 60) * 0.5; // ~28.6 deg/sec while actually playing
        }
      }
      renderDeckFace(key);
    });
    if (autoDj.on) autoDjTick(ctx.currentTime);
    updateLiveTimes();
    updateOnAir();
    updateDeckButtons();
    updateBeatStrip();
    requestAnimationFrame(tick);
  }

  // ---- wiring -----------------------------------------------------------
  els.addBtn.addEventListener('click', () => els.fileInput.click());
  els.dropzone.addEventListener('click', () => els.fileInput.click());
  els.dropzone.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') els.fileInput.click(); });
  els.fileInput.addEventListener('change', (e) => { addFiles(e.target.files); e.target.value = ''; });
  ['dragenter', 'dragover'].forEach((ev) => els.dropzone.addEventListener(ev, (e) => { e.preventDefault(); els.dropzone.classList.add('drag'); }));
  ['dragleave', 'drop'].forEach((ev) => els.dropzone.addEventListener(ev, (e) => { e.preventDefault(); els.dropzone.classList.remove('drag'); }));
  els.dropzone.addEventListener('drop', (e) => { if (e.dataTransfer && e.dataTransfer.files) addFiles(e.dataTransfer.files); });

  els.playA.addEventListener('click', () => togglePlay('A'));
  els.playB.addEventListener('click', () => togglePlay('B'));
  els.cueA.addEventListener('click', () => cueDeck('A'));
  els.cueB.addEventListener('click', () => cueDeck('B'));
  els.syncA.addEventListener('click', () => syncDeck('A'));
  els.syncB.addEventListener('click', () => syncDeck('B'));
  els.crossfader.addEventListener('input', applyCrossfader);
  els.volSlider.addEventListener('input', () => { if (masterGain) masterGain.gain.value = els.volSlider.value / 100; });
  els.autoDjBtn.addEventListener('click', () => setAutoDjOn(!autoDj.on));
  els.nextMixExecute.addEventListener('click', () => executePreviewNow());
  els.nextMixSkip.addEventListener('click', () => skipPreviewPick());
  els.nextMixChange.addEventListener('click', () => requestChangeTrack());

  // ---- pad banks: mode tabs + the 4 context-sensitive pads per deck --------
  // Tap-vs-long-press is decided entirely from pointerdown/pointerup timing,
  // never from a trailing native 'click' — a long-press clear rebuilds the
  // pad grid's innerHTML mid-press, which replaces the DOM node under the
  // pointer, and a browser won't fire 'click' when mousedown/mouseup land on
  // two different elements. Deciding at pointerup instead sidesteps that.
  const LONG_PRESS_MS = 550;
  const padPress = { A: { timer: null, longPressed: false }, B: { timer: null, longPressed: false } };
  ['A', 'B'].forEach((key) => {
    const tabs = key === 'A' ? els.padTabsA : els.padTabsB;
    tabs.addEventListener('click', (e) => {
      const btn = e.target.closest('.ptab');
      if (!btn) return;
      setPadMode(key, btn.dataset.mode);
    });

    const grid = key === 'A' ? els.padsA : els.padsB;
    // long-press clears an already-set hotcue or sampler pad. Only armed
    // when the pad is already "set" — an empty/capturable pad should always
    // respond to a plain tap (setting a cue, capturing a sample) without a
    // slightly-too-long press accidentally getting swallowed.
    grid.addEventListener('pointerdown', (e) => {
      const btn = e.target.closest('.pad');
      padPress[key].longPressed = false;
      if (!btn || btn.disabled) return;
      const mode = decks[key].padMode;
      if ((mode !== 'hotcue' && mode !== 'sampler') || !btn.classList.contains('set')) return;
      const idx = parseInt(btn.dataset.pad, 10);
      padPress[key].timer = setTimeout(() => {
        padPress[key].timer = null;
        padPress[key].longPressed = true;
        if (mode === 'hotcue') clearHotcue(key, idx); else clearSamplerSlot(key, idx);
      }, LONG_PRESS_MS);
    });
    grid.addEventListener('pointerup', (e) => {
      if (padPress[key].timer) { clearTimeout(padPress[key].timer); padPress[key].timer = null; }
      if (padPress[key].longPressed) { padPress[key].longPressed = false; return; } // already handled on the way down
      const btn = e.target.closest('.pad');
      if (!btn || btn.disabled) return;
      const idx = parseInt(btn.dataset.pad, 10);
      const mode = decks[key].padMode;
      if (mode === 'hotcue') hotcueAction(key, idx);
      else if (mode === 'fx') toggleFx(key, btn.dataset.pad);
      else if (mode === 'loop') toggleLoopSize(key, idx);
      else if (mode === 'sampler') samplerAction(key, idx);
    });
    ['pointerleave', 'pointercancel'].forEach((ev) => grid.addEventListener(ev, () => {
      if (padPress[key].timer) { clearTimeout(padPress[key].timer); padPress[key].timer = null; }
      padPress[key].longPressed = false;
    }));
  });

  els.eqHiA.addEventListener('input', () => setEq('A', 'high', parseFloat(els.eqHiA.value)));
  els.eqMidA.addEventListener('input', () => setEq('A', 'mid', parseFloat(els.eqMidA.value)));
  els.eqLowA.addEventListener('input', () => setEq('A', 'low', parseFloat(els.eqLowA.value)));
  els.colorA.addEventListener('input', () => setColorFilter('A', parseFloat(els.colorA.value)));
  els.tempoA.addEventListener('input', () => setTempo('A', parseFloat(els.tempoA.value)));
  els.eqHiB.addEventListener('input', () => setEq('B', 'high', parseFloat(els.eqHiB.value)));
  els.eqMidB.addEventListener('input', () => setEq('B', 'mid', parseFloat(els.eqMidB.value)));
  els.eqLowB.addEventListener('input', () => setEq('B', 'low', parseFloat(els.eqLowB.value)));
  els.colorB.addEventListener('input', () => setColorFilter('B', parseFloat(els.colorB.value)));
  els.tempoB.addEventListener('input', () => setTempo('B', parseFloat(els.tempoB.value)));

  window.__djDebug = {
    state, decks,
    actions: { hotcueAction, clearHotcue, toggleLoopSize, toggleFx, samplerAction, clearSamplerSlot, setPadMode, setEq, setColorFilter, setTempo, jumpDeckTo },
    now: () => (ctx ? ctx.currentTime : null),
    elapsed: deckElapsed,
    padPress,
    autoDj: {
      state: autoDj,
      setOn: setAutoDjOn,
      // test-only: shrink the lookahead window and/or scale transition
      // durations so short synthetic tracks can exercise prepare/transition
      // without waiting for full-length songs. Phrase-anchored triggering
      // means there's no separate fixed "lead time" constant anymore (V6
      // had one) — the trigger point comes from the track's own phrase
      // boundaries, scaled timing-wise by durationScale.
      setTiming: (lookaheadSeconds, durationScale) => {
        LOOKAHEAD_SECONDS = lookaheadSeconds;
        if (durationScale != null) TRANSITION_DURATION_SCALE = durationScale;
      },
      // test-only: drive the NEXT MIX preview controls without needing
      // real button clicks/DOM dispatch
      executeNow: () => executePreviewNow(),
      skip: () => skipPreviewPick(),
      changeTrack: () => requestChangeTrack(),
    },
  };
  renderDeckFace('A'); renderDeckFace('B');
  renderPadBank('A'); renderPadBank('B');
  requestAnimationFrame(tick);
})();
</script>
