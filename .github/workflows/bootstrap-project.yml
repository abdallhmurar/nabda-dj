name: Bootstrap Nabda DJ

on:
  push:
    branches: [main]
    paths:
      - 'bootstrap.trigger'

permissions:
  contents: write

jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild archive from chunks
        run: |
          cat .bootstrap/chunk-* > project.b64
          base64 -d project.b64 > nabda-dj.tar.gz
          gzip -t nabda-dj.tar.gz

      - name: Extract project archive
        run: |
          tar -xzf nabda-dj.tar.gz
          rm -rf .bootstrap bootstrap.trigger project.b64 nabda-dj.tar.gz

      - name: Validate production files
        run: |
          npm install
          npm run build

      - name: Commit project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "deploy: import verified V7 production"
          git push origin main
