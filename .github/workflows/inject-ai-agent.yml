name: Inject AI DJ Agent

on:
  push:
    branches: [main]
    paths:
      - 'ai-agent.js'
      - '.github/workflows/inject-ai-agent.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Inject AI Agent script tag
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="./ai-agent.js"></script>'
          if tag not in s:
              idx = s.rfind('</script>')
              if idx == -1:
                  s += '\n' + tag + '\n'
              else:
                  idx = s.find('\n', idx)
                  if idx == -1:
                      s += '\n' + tag + '\n'
                  else:
                      s = s[:idx+1] + tag + '\n' + s[idx+1:]
              p.write_text(s, encoding='utf-8')
          PY
      - name: Validate static build
        run: |
          npm install
          npm run build
      - name: Commit injected agent
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html ai-agent.js .github/workflows/inject-ai-agent.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: activate AI DJ takeover agent"
          git push origin main
